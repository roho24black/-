function renderList(filterText){
  const container = document.getElementById("listContainer");
  let people = allPersons().sort((a,b) => fullName(a).localeCompare(fullName(b), "ru"));
  if (filterText){
    const q = filterText.toLowerCase();
    people = people.filter(p => matchesQuery(p, q));
  }
  if (!people.length){
    container.innerHTML = '<div class="list-empty">Никого не найдено. Нажмите «+ Человек», чтобы добавить.</div>';
    return;
  }
  container.innerHTML = "";
  for (const p of people){
    const row = document.createElement("div");
    row.className = "person-row";
    row.innerHTML =
      '<div class="avatar ' + genderClass(p) + '">' + initials(p) + '</div>' +
      '<div class="info">' +
        '<div class="name">' + escapeHtml(displayLabel(p)) + (p.deathDate ? " †" : "") + '</div>' +
        '<div class="meta">' + escapeHtml([lifeSpan(p), p.birthPlace].filter(Boolean).join(" · ")) + '</div>' +
      '</div>';
    row.addEventListener("click", () => openDetail(p.id));
    container.appendChild(row);
  }
}
function matchesQuery(p, q){
  return [p.firstName,p.lastName,p.maidenName,p.birthPlace,p.deathPlace,p.notes]
    .filter(Boolean).some(v => v.toLowerCase().includes(q));
}

function personSelectOptions(excludeIds, includeNone){
  excludeIds = excludeIds || [];
  let html = includeNone ? '<option value="">— неизвестен —</option>' : "";
  const people = allPersons().sort((a,b)=>fullName(a).localeCompare(fullName(b),"ru"));
  for (const p of people){
    if (excludeIds.includes(p.id)) continue;
    html += '<option value="' + p.id + '">' + escapeHtml(displayLabel(p)) + (yearOf(p.birthDate) ? " (" + yearOf(p.birthDate) + ")" : "") + '</option>';
  }
  return html;
}

      '<div class="form-row"><label>Имя</label><input type="text" id="pfFirst" value="' + escapeAttr(p.firstName) + '"></div>' +
      '<div class="form-row"><label>Фамилия</label><input type="text" id="pfLast" value="' + escapeAttr(p.lastName) + '"></div>' +
    '</div>' +
    '<div class="form-row"><label>Девичья фамилия (если менялась)</label><input type="text" id="pfMaiden" value="' + escapeAttr(p.maidenName) + '"></div>' +
    '<div class="form-2col">' +
      '<div class="form-row"><label>Дата рождения</label><input type="text" id="pfBDate" placeholder="напр. 1952 или 1952-03-14" value="' + escapeAttr(p.birthDate) + '"></div>' +
      '<div class="form-row"><label>Место рождения</label><input type="text" id="pfBPlace" placeholder="город, страна" value="' + escapeAttr(p.birthPlace) + '"></div>' +
    '</div>' +
    '<div class="form-2col">' +
      '<div class="form-row"><label>Дата смерти (если применимо)</label><input type="text" id="pfDDate" value="' + escapeAttr(p.deathDate) + '"></div>' +
      '<div class="form-row"><label>Место смерти</label><input type="text" id="pfDPlace" value="' + escapeAttr(p.deathPlace) + '"></div>' +

      '<button type="button" id="pfCancel">Отмена</button>' +
      '<button type="button" id="pfSave" class="primary">Сохранить</button>' +
    '</div>';

  modal.querySelectorAll(".gender-toggle button").forEach(btn=>{

    });
  });

  modal.querySelector("#pfMother").value = p.motherId || "";

  showOverlay("modalOverlay");
  document.getElementById("pfClose").onclick = () => hideOverlay("modalOverlay");
  document.getElementById("pfCancel").onclick = () => hideOverlay("modalOverlay");
  document.getElementById("pfSave").onclick = () => {
    const fatherId = modal.querySelector("#pfFather").value || null;
    const motherId = modal.querySelector("#pfMother").value || null;
    if (fatherId && excludeSelf.has(fatherId)) { toast("Нельзя выбрать потомка как отца"); return; }
    if (motherId && excludeSelf.has(motherId)) { toast("Нельзя выбрать потомка как мать"); return; }
    p.gender = modal.dataset.gender || "";
    p.firstName = modal.querySelector("#pfFirst").value.trim();
    p.lastName = modal.querySelector("#pfLast").value.trim();

function descendantsSetIncludingSelf(id){
  const s = descendantsSet(id); s.add(id); return s;
}
function escapeAttr(s){ return escapeHtml(s||""); }

function quickAddSibling(baseId){
  const base = P(baseId);
  let fatherId = base.fatherId, motherId = base.motherId;
  if (!fatherId && !motherId){
    // создаём родителя-заглушку с понятным именем, чтобы связь была видна на дереве
    const placeholder = makePlaceholder("Родитель", fullName(base));
    fatherId = placeholder.id;
    base.fatherId = fatherId;
    save();
    toast("Создан общий родитель-заглушка «" + displayLabel(placeholder) + "» — заполните его данные позже");
  }
  openPersonForm({
    mode:"new",
    title:"Брат/сестра для " + fullName(base),
    subtitle:"Родители будут те же, что и у " + fullName(base) + ". Дерево сразу разветвится.",
    presetFatherId: fatherId, presetMotherId: motherId,
    afterSave: () => openDetail(baseId)
  });
}

/* Связать УЖЕ существующего человека как брата/сестру — без ручной
   привязки к одному и тому же родителю в двух разных карточках. */
function quickLinkExistingSibling(baseId){
  const base = P(baseId);
  const exclude = descendantsSetIncludingSelf(baseId);
  for (const anc of ancestorsSet(baseId)) exclude.add(anc);
  const siblingIds = new Set(allPersons().filter(x => x.id !== baseId && (
    (base.fatherId && x.fatherId === base.fatherId) || (base.motherId && x.motherId === base.motherId)
  )).map(x => x.id));
  const candidates = allPersons().filter(p => !exclude.has(p.id) && !siblingIds.has(p.id));

  const modal = document.getElementById("personModal");
  modal.innerHTML =
    '<button class="close-x" id="pfClose">×</button>' +
    '<h2>Связать как брата/сестру</h2>' +
    '<div class="sub">Выберите уже существующего человека — общий родитель подставится сам (а если ни у кого из них родитель ещё не указан, для него заведётся одна общая заглушка на двоих).</div>' +
    (candidates.length
      ? '<div class="form-row"><select id="sibSelect">' + candidates.slice().sort((a,b)=>fullName(a).localeCompare(fullName(b),"ru")).map(p => '<option value="'+p.id+'">'+escapeHtml(displayLabel(p))+'</option>').join("") + '</select></div>'
      : '<div class="hint-box">Подходящих людей пока нет — сначала добавьте кого-то отдельной карточкой.</div>') +
    '<div class="modal-actions"><button type="button" id="pfCancel">Отмена</button><button type="button" id="pfSave" class="primary"'+(candidates.length?'':' disabled')+'>Связать</button></div>';
  showOverlay("modalOverlay");
  document.getElementById("pfClose").onclick = () => hideOverlay("modalOverlay");
  document.getElementById("pfCancel").onclick = () => hideOverlay("modalOverlay");
  document.getElementById("pfSave").onclick = () => {
    const sel = modal.querySelector("#sibSelect");
    const otherId = sel ? sel.value : null;
    hideOverlay("modalOverlay");
    if (otherId && linkAsSiblings(baseId, otherId)){
      refreshAll();
      toast("Готово — теперь это братья/сёстры");
    }
    openDetail(baseId);
  };
}

function quickAddUncleAunt(baseId){
  const base = P(baseId);
  const parentOptions = [];
  if (base.fatherId && P(base.fatherId)) parentOptions.push({ id: base.fatherId, label: "по линии отца — " + fullName(P(base.fatherId)) });
  if (base.motherId && P(base.motherId)) parentOptions.push({ id: base.motherId, label: "по линии матери — " + fullName(P(base.motherId)) });

  function proceed(parentId){
    const parent = P(parentId);
    let gfId = parent.fatherId, gmId = parent.motherId;
    if (!gfId && !gmId){
      const placeholder = makePlaceholder("Прародитель", fullName(base));
      gfId = placeholder.id;
      parent.fatherId = gfId;
      save();
      toast("Создан родитель-заглушка «" + displayLabel(placeholder) + "» для " + fullName(parent) + " — заполните позже");
    }
    openPersonForm({
      mode:"new",
      title:"Дядя/тётя для " + fullName(base),
      subtitle:"Будет братом/сестрой " + fullName(parent) + ". Дерево сразу разветвится.",
      presetFatherId: gfId, presetMotherId: gmId,
      afterSave: () => openDetail(baseId)
    });
  }

  if (parentOptions.length === 0){
    // ни один родитель не известен — заводим сразу обоих недостающих
    // предков одним действием, с понятными различимыми именами, и без
    // путающего повторного тоста (раньше здесь был каскад из двух
    // отдельных заглушек с сообщением, ссылающимся самим на себя)
    const parentPh = makePlaceholder("Родитель", fullName(base));
    const grandparentPh = makePlaceholder("Прародитель", fullName(base));
    parentPh.fatherId = grandparentPh.id;
    base.fatherId = parentPh.id;
    save();
    toast("Созданы заглушки «" + displayLabel(parentPh) + "» и «" + displayLabel(grandparentPh) + "» — заполните их данные позже");
    openPersonForm({
      mode:"new",
      title:"Дядя/тётя для " + fullName(base),
      subtitle:"Будет братом/сестрой «" + displayLabel(parentPh) + "». Дерево сразу разветвится.",
      presetFatherId: grandparentPh.id, presetMotherId: null,
      afterSave: () => openDetail(baseId)
    });
    return;
  }
  if (parentOptions.length === 1){
    proceed(parentOptions[0].id);
    return;
  }
  // выбор стороны
  const modal = document.getElementById("personModal");
  modal.innerHTML =
    '<button class="close-x" id="pfClose">×</button>' +
    '<h2>Дядя/тётя для ' + escapeHtml(fullName(base)) + '</h2>' +
    '<div class="sub">С какой стороны?</div>' +
    '<div class="chip-grid">' +
      parentOptions.map(o => '<button class="chip" data-pid="' + o.id + '">' + escapeHtml(o.label) + '</button>').join("") +
    '</div>';
  showOverlay("modalOverlay");
  document.getElementById("pfClose").onclick = () => hideOverlay("modalOverlay");
  modal.querySelectorAll(".chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{ hideOverlay("modalOverlay"); proceed(btn.dataset.pid); });
  });
}

/* Связать УЖЕ существующего человека как дядю/тётю: выбираем сторону
   (как в quickAddUncleAunt), а дальше вместо создания нового человека
   выбираем существующего и делаем его братом/сестрой этого родителя —
   через ту же linkAsSiblings, что и для родных братьев/сестёр. */
function quickLinkExistingUncleAunt(baseId){
  const base = P(baseId);
  const parentOptions = [];
  if (base.fatherId && P(base.fatherId)) parentOptions.push({ id: base.fatherId, label: "по линии отца — " + fullName(P(base.fatherId)) });
  if (base.motherId && P(base.motherId)) parentOptions.push({ id: base.motherId, label: "по линии матери — " + fullName(P(base.motherId)) });

  function pickPerson(parentId){
    const parent = P(parentId);
    const exclude = descendantsSetIncludingSelf(parentId);
    for (const anc of ancestorsSet(parentId)) exclude.add(anc);
    exclude.add(baseId);
    const candidates = allPersons().filter(p => !exclude.has(p.id));
    const modal = document.getElementById("personModal");
    modal.innerHTML =
      '<button class="close-x" id="pfClose">×</button>' +
      '<h2>Дядя/тётя для ' + escapeHtml(fullName(base)) + '</h2>' +
      '<div class="sub">Выберите уже существующего человека — станет братом/сестрой ' + escapeHtml(fullName(parent)) + '.</div>' +
      (candidates.length
        ? '<div class="form-row"><select id="unSelect">' + candidates.slice().sort((a,b)=>fullName(a).localeCompare(fullName(b),"ru")).map(p => '<option value="'+p.id+'">'+escapeHtml(displayLabel(p))+'</option>').join("") + '</select></div>'
        : '<div class="hint-box">Подходящих людей пока нет.</div>') +
      '<div class="modal-actions"><button type="button" id="pfCancel">Отмена</button><button type="button" id="pfSave" class="primary"'+(candidates.length?'':' disabled')+'>Связать</button></div>';
    showOverlay("modalOverlay");
    document.getElementById("pfClose").onclick = () => hideOverlay("modalOverlay");
    document.getElementById("pfCancel").onclick = () => hideOverlay("modalOverlay");
    document.getElementById("pfSave").onclick = () => {
      const sel = modal.querySelector("#unSelect");
      const otherId = sel ? sel.value : null;
      hideOverlay("modalOverlay");
      if (otherId && linkAsSiblings(parentId, otherId)){
        refreshAll();
        toast("Готово — теперь это дядя/тётя для " + fullName(base));
      }
      openDetail(baseId);
    };
  }

  if (parentOptions.length === 0){
    const placeholder = makePlaceholder("Родитель", fullName(base));
    base.fatherId = placeholder.id;
    save();
    toast("Создан родитель-заглушка «" + displayLabel(placeholder) + "» — заполните его данные позже");
    pickPerson(placeholder.id);
    return;
  }
  if (parentOptions.length === 1){
    pickPerson(parentOptions[0].id);
    return;
  }
  const modal = document.getElementById("personModal");
  modal.innerHTML =
    '<button class="close-x" id="pfClose">×</button>' +
    '<h2>Дядя/тётя для ' + escapeHtml(fullName(base)) + '</h2>' +
    '<div class="sub">С какой стороны?</div>' +
    '<div class="chip-grid">' +
      parentOptions.map(o => '<button class="chip" data-pid="' + o.id + '">' + escapeHtml(o.label) + '</button>').join("") +
    '</div>';
  showOverlay("modalOverlay");
  document.getElementById("pfClose").onclick = () => hideOverlay("modalOverlay");
  modal.querySelectorAll(".chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{ hideOverlay("modalOverlay"); pickPerson(btn.dataset.pid); });
  });
}

function openDetail(id){
  const p = P(id);
  if (!p) return;
  const modal = document.getElementById("detailModal");

  const father = p.fatherId ? P(p.fatherId) : null;
  const mother = p.motherId ? P(p.motherId) : null;
  const spouses = (p.spouseIds||[]).map(P).filter(Boolean);
  const kids = children(id);
  const siblings = allPersons().filter(x => x.id !== id && (
    (p.fatherId && x.fatherId === p.fatherId) || (p.motherId && x.motherId === p.motherId)
  ));

  let html = '<button class="close-x" id="dtClose">×</button>';
  html += '<div class="detail-head"><div class="avatar ' + genderClass(p) + '" style="width:52px;height:52px;font-size:19px;">' + initials(p) + '</div>' +
    '<div><div class="name">' + escapeHtml(fullName(p)) + (p.deathDate?" †":"") + '</div>' +
    (p.maidenName ? '<div class="sub">урожд. ' + escapeHtml(p.maidenName) + '</div>' : '') +
    '</div></div>';

  html += '<div class="detail-facts">';
  if (p.birthDate || p.birthPlace) html += '<div class="fact"><span class="ico">🎂</span><span>' + escapeHtml([p.birthDate, p.birthPlace].filter(Boolean).join(" · ")) + '</span></div>';
  if (p.deathDate || p.deathPlace) html += '<div class="fact"><span class="ico">🕊</span><span>' + escapeHtml([p.deathDate, p.deathPlace].filter(Boolean).join(" · ")) + '</span></div>';
  if (p.notes) html += '<div class="fact"><span class="ico">📝</span><span>' + escapeHtml(p.notes) + '</span></div>';
  html += '</div>';

  html += '<div class="section-title">Родители</div><div class="rel-list">';
  html += relRow(father, "Отец", () => {}, true, id, "father");
  html += relRow(mother, "Мать", () => {}, true, id, "mother");
  html += '</div>';
  html += '<div class="chip-grid" style="margin-top:8px;">';
  if (!father) html += '<button class="chip" data-act="addFather">+ Отец (новый)</button><button class="chip" data-act="linkFather">+ Отец (существующий)</button>';
  if (!mother) html += '<button class="chip" data-act="addMother">+ Мать (новая)</button><button class="chip" data-act="linkMother">+ Мать (существующая)</button>';
  html += '</div>';

  html += '<div class="section-title">Братья и сёстры</div>';
  if (siblings.length){
    html += '<div class="rel-list">' + siblings.map(s => simpleRelItem(s)).join("") + '</div>';
  } else {
    html += '<div class="hint-box">Пока никого не добавлено.</div>';
  }
  html += '<div class="chip-grid" style="margin-top:8px;"><button class="chip" data-act="addSibling">+ Брат/сестра (новый)</button><button class="chip" data-act="linkSibling">+ Брат/сестра (существующий)</button></div>';

  html += '<div class="section-title">Дяди и тёти</div>';
  const auncles = [father, mother].filter(Boolean).flatMap(par =>
    allPersons().filter(x => x.id !== par.id && ((par.fatherId && x.fatherId===par.fatherId) || (par.motherId && x.motherId===par.motherId)))
  );
  const auncleUniq = Array.from(new Map(auncles.map(a=>[a.id,a])).values());
  if (auncleUniq.length){
    html += '<div class="rel-list">' + auncleUniq.map(s => simpleRelItem(s)).join("") + '</div>';
  } else {
    html += '<div class="hint-box">Пока никого не добавлено.</div>';
  }
  html += '<div class="chip-grid" style="margin-top:8px;"><button class="chip" data-act="addUncle">+ Дядя/тётя (новый)</button><button class="chip" data-act="linkUncle">+ Дядя/тётя (существующий)</button></div>';

  html += '<div class="section-title">Супруг(и)</div>';
  if (spouses.length){
    html += '<div class="rel-list">' + spouses.map(s =>
      '<div class="rel-item" data-goto="'+s.id+'"><span>' + escapeHtml(displayLabel(s)) + '</span><span class="rm" data-unspouse="'+s.id+'">убрать</span></div>'
    ).join("") + '</div>';
  } else {
    html += '<div class="hint-box">Пока никого не добавлено.</div>';
  }
  html += '<div class="chip-grid" style="margin-top:8px;"><button class="chip" data-act="addSpouseNew">+ Супруг(а) (новый)</button><button class="chip" data-act="linkSpouse">+ Супруг(а) (существующий)</button></div>';

  html += '<div class="section-title">Дети</div>';
  if (kids.length){
    html += '<div class="rel-list">' + kids.map(s => simpleRelItem(s)).join("") + '</div>';
  } else {
    html += '<div class="hint-box">Пока никого не добавлено.</div>';
  }
  html += '<div class="chip-grid" style="margin-top:8px;">';
  html += '<button class="chip" data-act="addChild">+ Ребёнок</button>';
  for (const s of spouses){
    html += '<button class="chip" data-act="addChildWith" data-spouse="'+s.id+'">+ Ребёнок c ' + escapeHtml(fullName(s)) + '</button>';
  }
  html += '</div>';

  html += '<div class="modal-actions">' +
    '<button type="button" id="dtEdit">✎ Изменить</button>' +
    '<button type="button" id="dtLocate">🔎 Показать на древе</button>' +
    '<button type="button" id="dtDelete" class="danger">Удалить</button>' +
  '</div>';

  modal.innerHTML = html;
  showOverlay("detailOverlay");

  document.getElementById("dtClose").onclick = () => hideOverlay("detailOverlay");
  document.getElementById("dtEdit").onclick = () => { hideOverlay("detailOverlay"); openPersonForm({ mode:"edit", personId:id }); };
  document.getElementById("dtLocate").onclick = () => { hideOverlay("detailOverlay"); locateOnTree(id); };
  document.getElementById("dtDelete").onclick = () => {
    if (confirm("Удалить " + fullName(p) + "? Связи с ним у других людей будут очищены.")){
      deletePerson(id);
      hideOverlay("detailOverlay");
      refreshAll();
      toast("Удалено");
    }
  };

  modal.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", (ev)=>{
      if (ev.target.closest("[data-unspouse]")) return;
      openDetail(el.dataset.goto);
    });
  });
  modal.querySelectorAll("[data-unspouse]").forEach(el=>{
    el.addEventListener("click", (ev)=>{
      ev.stopPropagation();
      removeSpouseLink(id, el.dataset.unspouse);
      refreshAll();
      openDetail(id);
    });
  });
  const act = (sel, fn) => { const el = modal.querySelector(sel); if (el) el.addEventListener("click", fn); };
  act('[data-act="addFather"]', () => { hideOverlay("detailOverlay"); quickAddParent(id, "father"); });
  act('[data-act="addMother"]', () => { hideOverlay("detailOverlay"); quickAddParent(id, "mother"); });
  act('[data-act="linkFather"]', () => { hideOverlay("detailOverlay"); quickLinkExistingRelative(id, "father"); });
  act('[data-act="linkMother"]', () => { hideOverlay("detailOverlay"); quickLinkExistingRelative(id, "mother"); });
  act('[data-act="addSibling"]', () => { hideOverlay("detailOverlay"); quickAddSibling(id); });
  act('[data-act="linkSibling"]', () => { hideOverlay("detailOverlay"); quickLinkExistingSibling(id); });
  act('[data-act="addUncle"]', () => { hideOverlay("detailOverlay"); quickAddUncleAunt(id); });
  act('[data-act="linkUncle"]', () => { hideOverlay("detailOverlay"); quickLinkExistingUncleAunt(id); });
  act('[data-act="addSpouseNew"]', () => { hideOverlay("detailOverlay"); quickAddSpouseNew(id); });
  act('[data-act="linkSpouse"]', () => { hideOverlay("detailOverlay"); quickLinkExistingSpouse(id); });
  act('[data-act="addChild"]', () => { hideOverlay("detailOverlay"); quickAddChild(id); });
  modal.querySelectorAll('[data-act="addChildWith"]').forEach(el=>{
    el.addEventListener("click", ()=>{ hideOverlay("detailOverlay"); quickAddChild(id, el.dataset.spouse); });
  });
}
function relRow(person, label, onClick, editable, baseId, role){

  return '<div class="rel-item" data-goto="' + person.id + '"><span class="tag">' + label + '</span><span>' + escapeHtml(displayLabel(person)) + '</span></div>';

  return '<div class="rel-item" data-goto="' + p.id + '"><span>' + escapeHtml(displayLabel(p)) + (lifeSpan(p) ? ' <span class="tag">' + escapeHtml(lifeSpan(p)) + '</span>' : '') + '</span></div>';

/* локализация на дереве: переключить на вкладку, подсветить, проскроллить */
function locateOnTree(id){
  currentHighlightId = id;
  switchTab("tree");
  renderTree();
  requestAnimationFrame(()=>{
    const layout = computeLayout();
    const pos = layout.positions[id];
    const scrollWrap = document.getElementById("treeScroll");
    if (pos && scrollWrap){
      const x = PAD + pos.x * SLOT_W;
      const y = PAD + pos.depth * ROW_H;
      scrollWrap.scrollTo({
        left: Math.max(0, x * zoomLevel - scrollWrap.clientWidth/2),
        top: Math.max(0, y * zoomLevel - scrollWrap.clientHeight/3),
        behavior:"smooth"
      });
    }
  });
  setTimeout(()=>{ currentHighlightId = null; renderTree(); }, 2600);
}

/* ---------------------------------------------------------------- */
/* Сохранить/отправить дерево как картинку (PNG)                    */
/* ---------------------------------------------------------------- */
/* Растровый экспорт строим НЕ из живого дерева (там карточки — это HTML
   внутри <foreignObject>), а отдельной, чисто SVG-шной версией (rect+text).
   Это принципиально: canvas.toBlob() бросает SecurityError ("tainted
   canvas") для любого SVG с <foreignObject> внутри, даже если всё
   содержимое локальное и одного происхождения — так браузеры трактуют
   HTML-в-SVG как потенциально небезопасный контент. Чистый SVG без
   foreignObject этой проблемы не имеет и рисуется в canvas без ограничений. */
function truncateForBox(s, maxChars){
  if (!s) return "";
  s = String(s);
  return s.length > maxChars ? s.slice(0, maxChars - 1) + "…" : s;
}
function svgText(x, y, str, attrs){
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", x); t.setAttribute("y", y);
  t.setAttribute("text-anchor", "middle");
  for (const k in attrs) t.setAttribute(k, attrs[k]);
  t.textContent = str;
  return t;
}
function buildExportSvg(layout, w, h, colors){
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  svg.setAttribute("width", w); svg.setAttribute("height", h);
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);

  const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  bg.setAttribute("x", 0); bg.setAttribute("y", 0);
  bg.setAttribute("width", w); bg.setAttribute("height", h);
  bg.setAttribute("fill", colors.bg);
  svg.appendChild(bg);

  function px(slotX){ return PAD + slotX * SLOT_W; }
  function py(depth){ return PAD + depth * ROW_H; }

  const linesG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const nodesG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  svg.appendChild(linesG); svg.appendChild(nodesG);

  // все связи — тем же единым списком, что и на экране (computeConnectors)
  for (const seg of computeConnectors(layout)){
    if (seg.type === "line"){
      const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
      l.setAttribute("x1", seg.x1); l.setAttribute("y1", seg.y1); l.setAttribute("x2", seg.x2); l.setAttribute("y2", seg.y2);
      l.setAttribute("stroke", colors.clan(seg.clan)); l.setAttribute("stroke-width", 2);
      linesG.appendChild(l);
    } else {
      const d = seg.d || seg.points.map((pt, i) => (i === 0 ? "M " : "L ") + pt[0] + " " + pt[1]).join(" ");
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", colors.clan(seg.clan)); p.setAttribute("stroke-width", 2);
      linesG.appendChild(p);
    }
  }

  for (const p of allPersons()){
    const pos = layout.positions[p.id];
    if (!pos) continue;
    const x = px(pos.x) - NODE_W/2, y = py(pos.depth);
    const stroke = p.gender === "M" ? colors.male : p.gender === "F" ? colors.female : colors.unknown;
    const fill = p.gender === "M" ? colors.maleBg : p.gender === "F" ? colors.femaleBg : colors.unknownBg;

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", x); rect.setAttribute("y", y);
    rect.setAttribute("width", NODE_W); rect.setAttribute("height", NODE_H);
    rect.setAttribute("rx", 10);
    rect.setAttribute("fill", fill); rect.setAttribute("stroke", stroke); rect.setAttribute("stroke-width", 2);
    if (p.deathDate) rect.setAttribute("opacity", "0.72");
    nodesG.appendChild(rect);

    const lines = [];
    lines.push({ t: truncateForBox(fullName(p) + (p.deathDate ? " †" : ""), 24), size: 12.5, weight: "700", color: colors.ink });
    if (p.maidenName) lines.push({ t: truncateForBox("урожд. " + p.maidenName, 22), size: 10.5, style: "italic", color: colors.muted });
    if (lifeSpan(p)) lines.push({ t: truncateForBox(lifeSpan(p), 24), size: 10.5, color: colors.muted });
    if (p.birthPlace) lines.push({ t: truncateForBox("📍 " + p.birthPlace, 22), size: 10, color: colors.muted });
    const spouseNames = (p.spouseIds||[]).map(sid => P(sid)).filter(Boolean).map(s => fullName(s));
    if (spouseNames.length) lines.push({ t: truncateForBox("⚭ " + spouseNames.join(", "), 22), size: 10, color: colors.accent2 });

    const lineH = 13.5;
    const totalH = lines.length * lineH;
    let ty = y + NODE_H/2 - totalH/2 + lineH*0.75;
    const cx = x + NODE_W/2;
    for (const ln of lines){
      const attrs = { "font-size": ln.size, fill: ln.color, "font-family": "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" };
      if (ln.weight) attrs["font-weight"] = ln.weight;
      if (ln.style) attrs["font-style"] = ln.style;
      nodesG.appendChild(svgText(cx, ty, ln.t, attrs));
      ty += lineH;
    }
  }

  return svg;
}

async function exportTreeAsImage(){
  if (!allPersons().length){ toast("Дерево пустое — нечего сохранять"); return; }

  const layout = computeLayout();
  const w = Math.max(layout.width, 1) * SLOT_W + PAD*2;
  const h = (layout.maxDepth + 1) * ROW_H + PAD*2;

  toast("Готовим изображение…");

  const cs = getComputedStyle(document.documentElement);
  const cssVar = (name, fallback) => (cs.getPropertyValue(name) || "").trim() || fallback;
  const colors = {
    bg: cssVar("--bg", "#f5f1e8"),
    ink: cssVar("--ink", "#2b2620"),
    muted: cssVar("--muted", "#7c7364"),
    accent2: cssVar("--accent-2", "#b6844f"),
    male: cssVar("--male", "#4a6fa5"), maleBg: cssVar("--male-bg", "#e8eff8"),
    female: cssVar("--female", "#a5486f"), femaleBg: cssVar("--female-bg", "#f8e8ef"),
    unknown: cssVar("--unknown", "#8a8272"), unknownBg: cssVar("--unknown-bg", "#eeeae1"),
    line: cssVar("--line", "#b8ac93")
  };
  // В экспортируемом SVG переменные темы не работают — там нет нашей
  // страницы со стилями. Поэтому цвета родов подставляем готовыми
  // значениями, вычисленными из текущей темы.
  const clanFallback = ["#8a6a3a","#3f6f7a","#7a4a63","#5c6b3a","#6a4a8a","#8a5540","#3f6b52","#7a6a2f",
                        "#5a5f8a","#8a4a4a","#2f6a6a","#6b5a2f","#7a3f5a","#456b8a","#6b7a3a","#8a6a5a",
                        "#4a5a6b","#7a5a8a","#3a6b5f","#8a7a3f"];
  const clanColors = clanFallback.map((def, i) => cssVar("--clan-" + (i+1), def));
  colors.clan = (clan) => clanColors[((((clan | 0) % clanColors.length) + clanColors.length) % clanColors.length)];

  const exportSvg = buildExportSvg(layout, w, h, colors);
  const svgString = new XMLSerializer().serializeToString(exportSvg);
  const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const svgUrl = URL.createObjectURL(svgBlob);

  try {
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error("image load failed"));
      im.src = svgUrl;
    });

    const scale = 2; // резкость на экранах с высокой плотностью пикселей
    const canvas = document.createElement("canvas");
    canvas.width = w * scale;
    canvas.height = h * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(svgUrl);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    if (!blob){ toast("Не удалось создать изображение"); return; }

    const stamp = new Date().toISOString().slice(0, 10);
    const filename = "semeynoe-drevo-" + stamp + ".png";
    const file = new File([blob], filename, { type: "image/png" });

    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({ files: [file], title: "Семейное древо" });
        return;
      }catch(shareErr){
        if (shareErr && shareErr.name === "AbortError") return; // пользователь отменил
        // иначе — падаем в обычное скачивание ниже
      }
    }
    const dlUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = dlUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(dlUrl), 4000);
    toast("Картинка сохранена — можно отправить как файл");
  } catch (err){
    URL.revokeObjectURL(svgUrl);
    console.warn("image export failed", err);
    toast("Не удалось сохранить изображение");
  }
}

/* закрытие модалок по клику на подложку */
document.getElementById("modalOverlay").addEventListener("click", (e)=>{ if (e.target.id === "modalOverlay") hideOverlay("modalOverlay"); });
document.getElementById("detailOverlay").addEventListener("click", (e)=>{ if (e.target.id === "detailOverlay") hideOverlay("detailOverlay"); });

function refreshAll(){
  renderTree();
  renderList(document.getElementById("searchInput").value.trim());
  applyZoom();
}

load();
refreshAll();
})();
</script>
