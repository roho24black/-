<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Семейное древо</title>
<meta name="theme-color" content="#f5f1e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Древо">
<style>
:root{
  --bg:#f5f1e8;
  --bg2:#ede6d6;
  --card:#ffffff;
  --card-border:#ddd3bd;
  --ink:#2b2620;
  --muted:#7c7364;
  --accent:#8a5a34;
  --accent-2:#b6844f;
  --male:#4a6fa5;
  --male-bg:#e8eff8;
  --female:#a5486f;
  --female-bg:#f8e8ef;
  --unknown:#8a8272;
  --unknown-bg:#eeeae1;
  --line:#b8ac93;
  --danger:#a5423a;
  --ok:#3f7a4e;
  --shadow:rgba(60,45,20,.16);
  --radius:14px;
  /* Цвета линий по родам. Каждая независимая родословная получает свой
     цвет, поэтому в местах, где ветви разных родов идут рядом или
     пересекаются, видно, какая линия чья, и они не сливаются в кашу.
     Оттенки подобраны так, чтобы различаться и не спорить с цветами
     карточек (синие — мужчины, розовые — женщины). */
  --clan-1:#8a6a3a;
  --clan-2:#3f6f7a;
  --clan-3:#7a4a63;
  --clan-4:#5c6b3a;
  --clan-5:#6a4a8a;
  --clan-6:#8a5540;
  --clan-7:#3f6b52;
  --clan-8:#7a6a2f;
  --clan-9:#5a5f8a;
  --clan-10:#8a4a4a;
  --clan-11:#2f6a6a;
  --clan-12:#6b5a2f;
  --clan-13:#7a3f5a;
  --clan-14:#456b8a;
  --clan-15:#6b7a3a;
  --clan-16:#8a6a5a;
  --clan-17:#4a5a6b;
  --clan-18:#7a5a8a;
  --clan-19:#3a6b5f;
  --clan-20:#8a7a3f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1712;
    --bg2:#141110;
    --card:#242019;
    --card-border:#3a3327;
    --ink:#f1ead9;
    --muted:#b3a793;
    --accent:#e0aa6c;
    --accent-2:#c98f4f;
    --male:#8fb3e8;
    --male-bg:#20304a;
    --female:#e79cbb;
    --female-bg:#40232f;
    --unknown:#b3a793;
    --unknown-bg:#2c2820;
    --line:#5a513e;
    --shadow:rgba(0,0,0,.45);
    /* на тёмном фоне те же рода, но светлее — иначе линии тонут в фоне */
    --clan-1:#c9a26a;
    --clan-2:#6fb0c2;
    --clan-3:#c98aa8;
    --clan-4:#9fb56a;
    --clan-5:#a98ad0;
    --clan-6:#d69479;
    --clan-7:#6fbb94;
    --clan-8:#c4b268;
    --clan-9:#9aa0d6;
    --clan-10:#d68a8a;
    --clan-11:#6fb8b8;
    --clan-12:#bda87a;
    --clan-13:#d68ab0;
    --clan-14:#8fb0d6;
    --clan-15:#b6c47a;
    --clan-16:#d6b0a0;
    --clan-17:#9ab0c4;
    --clan-18:#c4a0d6;
    --clan-19:#7ac4ad;
    --clan-20:#d6c489;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; overflow-x:hidden;
}
button{font-family:inherit;}
#app{flex:1; display:flex; flex-direction:column; min-height:100dvh;}

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 12px calc(8px + env(safe-area-inset-top,0px)) 12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-bottom:1px solid var(--card-border);
  position:sticky; top:0; z-index:20;
}
.topbar h1{font-size:17px; margin:0; white-space:nowrap; display:flex; align-items:center; gap:6px;}
.topbar-actions{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
.iconbtn{
  border:1px solid var(--card-border); background:var(--card); color:var(--ink);
  border-radius:10px; padding:7px 10px; font-size:13px; cursor:pointer; white-space:nowrap;
}
.iconbtn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
.iconbtn:active{transform:scale(.96);}

.tabs{display:flex; gap:6px; padding:8px 12px 0 12px; background:var(--bg);}
.tab{
  flex:1; padding:9px 8px; text-align:center; border-radius:10px 10px 0 0;
  border:1px solid var(--card-border); border-bottom:none; background:var(--bg2);
  color:var(--muted); font-size:14px; cursor:pointer;
}
.tab.active{background:var(--card); color:var(--ink); font-weight:600;}

.searchbar{padding:8px 12px; background:var(--card); border-bottom:1px solid var(--card-border);}
.searchbar input{
  width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--card-border);
  background:var(--bg); color:var(--ink); font-size:14px;
}

main{flex:1; display:flex; flex-direction:column; min-height:0;}
.view{display:none; flex:1; min-height:0; flex-direction:column;}
.view.active{display:flex;}

.tree-toolbar{
  display:flex; gap:6px; padding:6px 10px; background:var(--bg2);
  border-bottom:1px solid var(--card-border); align-items:center;
}
.tree-toolbar .spacer{flex:1;}
.tree-toolbar select{
  border:1px solid var(--card-border); background:var(--card); color:var(--ink);
  border-radius:8px; padding:6px 8px; font-size:12px;
}
.tree-scroll{flex:1; overflow:auto; background:
  radial-gradient(circle at 1px 1px, var(--card-border) 1px, transparent 1px) 0 0/22px 22px, var(--bg);
  touch-action:pan-x pan-y;
}
.tree-inner{display:inline-block; padding:40px; transform-origin:0 0;}
#treeSvg{display:block;}

.empty-state{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:30px; text-align:center; color:var(--muted);
}
.empty-state[hidden]{display:none;}
.empty-state .big{font-size:44px;}
.empty-state h2{margin:0; color:var(--ink); font-size:18px;}
.empty-state p{margin:0; max-width:320px; font-size:14px; line-height:1.5;}

#listView{overflow:auto; padding:10px 12px 30px 12px;}
.person-row{
  display:flex; align-items:center; gap:10px; padding:10px 10px; margin-bottom:8px;
  background:var(--card); border:1px solid var(--card-border); border-radius:12px; cursor:pointer;
}
.person-row:active{transform:scale(.99);}
.avatar{
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:700; flex-shrink:0; color:#fff;
}
.avatar.M{background:var(--male);} .avatar.F{background:var(--female);} .avatar.U{background:var(--unknown);}
.person-row .info{flex:1; min-width:0;}
.person-row .name{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.person-row .meta{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-empty{padding:40px 20px; text-align:center; color:var(--muted);}

/* tree node svg-html hybrid via foreignObject */
.node-box{
  width:172px; min-height:64px; border-radius:10px; border:2px solid var(--unknown);
  background:var(--unknown-bg); padding:6px 8px; font-size:11.5px; line-height:1.35;
  box-shadow:0 2px 6px var(--shadow); cursor:pointer; color:var(--ink);
  display:flex; flex-direction:column; justify-content:center; text-align:center;
  user-select:none;
}
.node-box.M{border-color:var(--male); background:var(--male-bg);}
.node-box.F{border-color:var(--female); background:var(--female-bg);}
.node-box.dead{opacity:.72;}
.node-box.dim{opacity:.28;}
.node-box.highlight{outline:3px solid var(--accent); box-shadow:0 0 0 4px rgba(180,120,40,.25);}
.node-box .nm{font-weight:700; font-size:12.5px;}
.node-box .mn{font-size:10.5px; color:var(--muted); font-style:italic;}
.node-box .dt{font-size:10.5px; color:var(--muted); margin-top:2px;}
.node-box .pl{font-size:10px; color:var(--muted);}
.node-box .sp{font-size:10px; color:var(--accent-2); margin-top:2px;}

/* modals */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,15,8,.5); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-overlay[hidden]{display:none;}
@media (min-width:640px){ .modal-overlay{align-items:center;} }
.modal{
  background:var(--card); width:100%; max-width:520px; max-height:92dvh; overflow:auto;
  border-radius:16px 16px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px)) 16px;
  box-shadow:0 -6px 30px var(--shadow);
}
@media (min-width:640px){ .modal{border-radius:16px; max-height:88dvh;} }
.modal h2{margin:0 0 4px 0; font-size:17px;}
.modal .sub{color:var(--muted); font-size:12.5px; margin-bottom:12px;}
.form-row{margin-bottom:10px;}
.form-row label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px; font-weight:600;}
.form-row input[type=text],.form-row input[type=date],.form-row select,.form-row textarea{
  width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--card-border);
  background:var(--bg); color:var(--ink); font-size:14.5px;
}
.form-row textarea{min-height:56px; resize:vertical; font-family:inherit;}
.form-2col{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.gender-toggle{display:flex; gap:6px;}
.gender-toggle button{
  flex:1; padding:8px; border-radius:9px; border:1px solid var(--card-border); background:var(--bg);
  color:var(--ink); font-size:13px; cursor:pointer;
}
.gender-toggle button.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
.modal-actions{display:flex; gap:8px; margin-top:14px;}
.modal-actions button{
  flex:1; padding:11px; border-radius:10px; border:1px solid var(--card-border); background:var(--bg);
  color:var(--ink); font-size:14.5px; font-weight:600; cursor:pointer;
}
.modal-actions button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.modal-actions button.danger{background:var(--danger); border-color:var(--danger); color:#fff;}
.close-x{
  position:absolute; top:10px; right:10px; background:none; border:none; font-size:20px;
  color:var(--muted); cursor:pointer; padding:4px 8px;
}
.modal{position:relative;}

.detail-head{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
.detail-head .avatar{width:52px; height:52px; font-size:19px;}
.detail-head .name{font-size:18px; font-weight:700;}
.detail-head .sub{font-size:12.5px; color:var(--muted);}
.detail-facts{margin:12px 0; font-size:13.5px; line-height:1.9;}
.detail-facts .fact{display:flex; gap:6px;}
.detail-facts .fact .ico{width:20px; flex-shrink:0;}
.section-title{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:16px 0 8px 0;}
.chip-grid{display:flex; flex-wrap:wrap; gap:7px;}
.chip{
  border:1px solid var(--card-border); background:var(--bg); border-radius:20px; padding:7px 12px;
  font-size:12.5px; cursor:pointer; color:var(--ink); display:flex; align-items:center; gap:4px;
}
.chip:active{transform:scale(.96);}
.rel-list{display:flex; flex-direction:column; gap:6px;}
.rel-item{
  display:flex; align-items:center; gap:8px; padding:7px 9px; background:var(--bg);
  border:1px solid var(--card-border); border-radius:9px; font-size:13px; cursor:pointer;
}
.rel-item .tag{font-size:10.5px; color:var(--muted); background:var(--bg2); padding:2px 6px; border-radius:6px;}
.rel-item .rm{margin-left:auto; color:var(--danger); font-size:12px; cursor:pointer; padding:2px 6px;}

.toast{
  position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:#2b2620; color:#f5f1e8; padding:10px 18px; border-radius:20px; font-size:13.5px;
  z-index:200; box-shadow:0 4px 14px rgba(0,0,0,.3); max-width:88vw; text-align:center;
}
[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{background:#e0aa6c; color:#1b1712;}
@media (prefers-color-scheme:light){ :root[data-theme="dark"] .toast{background:#e0aa6c; color:#1b1712;} }

.hint-box{
  background:var(--bg2); border:1px dashed var(--card-border); border-radius:10px; padding:9px 11px;
  font-size:12px; color:var(--muted); margin-bottom:10px; line-height:1.5;
}
@media print{
  .topbar,.tabs,.searchbar,.tree-toolbar,.empty-state,#listView{display:none !important;}
  .tree-scroll{overflow:visible !important; height:auto !important;}
  .tree-inner{transform:none !important; padding:0 !important;}
  body{background:#fff;}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>🌳 Семейное древо</h1>
    <div class="topbar-actions">
      <button class="iconbtn primary" id="btnAddPerson">+ Человек</button>
      <button class="iconbtn" id="btnExport" title="Скачать резервную копию">⬇ Экспорт</button>
      <button class="iconbtn" id="btnImportBtn" title="Загрузить из файла">⬆ Импорт</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="iconbtn" id="btnPhoto" title="Сохранить дерево как картинку и отправить">📷 Как фото</button>
      <button class="iconbtn" id="btnPrint" title="Печать / PDF">🖨</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="tree">Древо</button>
    <button class="tab" data-tab="list">Список людей</button>
  </div>

  <div class="searchbar">
    <input id="searchInput" placeholder="🔍 Поиск: имя, фамилия, место рождения...">
  </div>

  <main>
    <section id="treeView" class="view active">
      <div class="tree-toolbar">
        <button class="iconbtn" id="zoomOut">−</button>
        <button class="iconbtn" id="zoomReset">100%</button>
        <button class="iconbtn" id="zoomIn">+</button>
        <div class="spacer"></div>
        <span style="font-size:11.5px;color:var(--muted)" id="peopleCount"></span>
      </div>
      <div id="treeScroll" class="tree-scroll">
        <div id="treeInner" class="tree-inner">
          <svg id="treeSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
      <div id="emptyState" class="empty-state" hidden>
        <div class="big">🌳</div>
        <h2>Дерево пока пустое</h2>
        <p>Добавьте первого человека — например, себя. Затем добавляйте родителей, супругов, детей,
        братьев/сестёр и дядь/тётей прямо из карточки каждого человека — дерево будет ветвиться само.</p>
        <button class="iconbtn primary" id="btnStart">Добавить первого человека</button>
      </div>
    </section>

    <section id="listView" class="view">
      <div id="listContainer"></div>
    </section>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal" id="personModal"></div>
</div>
<div id="detailOverlay" class="modal-overlay" hidden>
  <div class="modal" id="detailModal"></div>
</div>
<div id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- */
/* Данные                                                           */
/* ---------------------------------------------------------------- */
const STORAGE_KEY = "familyTree.v1";
let DB = { persons: {} };

function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){ DB = JSON.parse(raw); if (!DB.persons) DB.persons = {}; }
  }catch(e){ console.warn("load failed", e); DB = { persons:{} }; }
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){ console.warn("save failed", e); }
}

function newPerson(partial){
  return Object.assign({
    id: uid(),
    firstName: "", lastName: "", maidenName: "",
    gender: "", // 'M' | 'F' | ''
    birthDate: "", birthPlace: "",
    deathDate: "", deathPlace: "",
    notes: "",
    fatherId: null, motherId: null,
    spouseIds: []
  }, partial);
}

function P(id){ return DB.persons[id] || null; }
function allPersons(){ return Object.values(DB.persons); }

function fullName(p){
  if (!p) return "?";
  const n = [p.firstName, p.lastName].filter(Boolean).join(" ").trim();
  return n || "Без имени";
}
function displayLabel(p){
  let n = fullName(p);
  if (p.maidenName && p.maidenName.trim()) n += " (урожд. " + p.maidenName.trim() + ")";
  return n;
}
function yearOf(s){
  if (!s) return "";
  const m = String(s).match(/\d{4}/);
  return m ? m[0] : "";
}
function lifeSpan(p){
  // Полные даты, как их ввели (не только год) — если известна лишь
  // часть даты, показываем как есть, ничего не обрезаем.
  const b = (p.birthDate || "").trim();
  const d = (p.deathDate || "").trim();
  if (!b && !d) return "";
  return (b || "?") + "–" + d;
}
function initials(p){
  const a = (p.firstName||"").trim()[0] || "";
  const b = (p.lastName||"").trim()[0] || "";
  return (a+b).toUpperCase() || "?";
}
function genderClass(p){ return p.gender === "M" ? "M" : p.gender === "F" ? "F" : "U"; }

/* ---------------------------------------------------------------- */
/* Отношения / целостность                                          */
/* ---------------------------------------------------------------- */
function children(personId){
  return allPersons().filter(p => p.fatherId === personId || p.motherId === personId);
}
function descendantsSet(personId){
  const out = new Set(); const stack = [personId];
  while (stack.length){
    const id = stack.pop();
    for (const c of children(id)){
      if (!out.has(c.id)){ out.add(c.id); stack.push(c.id); }
    }
  }
  return out;
}
function wouldCreateCycle(personId, candidateParentId){
  if (!candidateParentId) return false;
  if (candidateParentId === personId) return true;
  return descendantsSet(personId).has(candidateParentId);
}
function setParent(personId, role, parentId){
  const p = P(personId); if (!p) return false;
  if (wouldCreateCycle(personId, parentId)){
    toast("Нельзя: это создаст замкнутый круг родства");
    return false;
  }
  p[role === "father" ? "fatherId" : "motherId"] = parentId || null;
  save();
  return true;
}
function addSpouseLink(aId, bId){
  const a = P(aId), b = P(bId);
  if (!a || !b || aId === bId) return;
  a.spouseIds = a.spouseIds || [];
  b.spouseIds = b.spouseIds || [];
  if (!a.spouseIds.includes(bId)) a.spouseIds.push(bId);
  if (!b.spouseIds.includes(aId)) b.spouseIds.push(aId);
  save();
}
function removeSpouseLink(aId, bId){
  const a = P(aId), b = P(bId);
  if (a) a.spouseIds = (a.spouseIds||[]).filter(x=>x!==bId);
  if (b) b.spouseIds = (b.spouseIds||[]).filter(x=>x!==aId);
  save();
}
function deletePerson(id){
  delete DB.persons[id];
  for (const p of allPersons()){
    if (p.fatherId === id) p.fatherId = null;
    if (p.motherId === id) p.motherId = null;
    if (p.spouseIds) p.spouseIds = p.spouseIds.filter(x=>x!==id);
  }
  save();
}
function ancestorsSet(personId){
  const out = new Set();
  const start = P(personId);
  const stack = [];
  if (start){ if (start.fatherId) stack.push(start.fatherId); if (start.motherId) stack.push(start.motherId); }
  while (stack.length){
    const id = stack.pop();
    if (out.has(id)) continue;
    out.add(id);
    const p = P(id);
    if (p){ if (p.fatherId) stack.push(p.fatherId); if (p.motherId) stack.push(p.motherId); }
  }
  return out;
}
/* Создаёт человека-заглушку с понятным, различимым именем (не просто
   "Родитель (уточнить)" — иначе в дереве накапливаются одинаковые с виду
   карточки, и непонятно, чей это родитель). kind — "Родитель" или
   "Прародитель" (для уровня на поколение выше), refText — короткая
   подсказка, к кому он относится. */
function makePlaceholder(kind, refText){
  const ph = newPerson({ firstName: kind, lastName: refText ? "(" + refText + ")" : "(уточнить)" });
  DB.persons[ph.id] = ph;
  return ph;
}
/* Связать двух УЖЕ существующих людей как братьев/сестёр. Раньше это
   приходилось делать вручную — открыть карточку каждого и по отдельности
   выставить одного и того же родителя в выпадающем списке. Эта функция
   делает это одним действием: если у одного из них родитель уже указан,
   а у другого нет — просто копирует; если совпадающих родителей нет
   вовсе — заводит одного общего родителя-заглушку сразу для обоих. */
function linkAsSiblings(aId, bId){
  const a = P(aId), b = P(bId);
  if (!a || !b || aId === bId) return false;
  if (descendantsSet(aId).has(bId) || descendantsSet(bId).has(aId)){
    toast("Один из них — потомок другого, братьями/сёстрами быть не может");
    return false;
  }
  function reconcileSlot(role){
    if (a[role] && b[role]) return a[role] === b[role] ? "ok" : "conflict";
    if (a[role] && !b[role]) { b[role] = a[role]; return "ok"; }
    if (!a[role] && b[role]) { a[role] = b[role]; return "ok"; }
    return "empty";
  }
  const fatherState = reconcileSlot("fatherId");
  const motherState = reconcileSlot("motherId");
  const alreadySiblings = (a.fatherId && a.fatherId === b.fatherId) || (a.motherId && a.motherId === b.motherId);
  if (!alreadySiblings){
    if (fatherState === "empty"){
      const ph = makePlaceholder("Родитель", fullName(a) + " и " + fullName(b));
      a.fatherId = ph.id; b.fatherId = ph.id;
    } else if (motherState === "empty"){
      const ph = makePlaceholder("Родитель", fullName(a) + " и " + fullName(b));
      a.motherId = ph.id; b.motherId = ph.id;
    } else {
      toast("Не получилось: у обоих уже указаны разные родители — сначала поправьте вручную");
      return false;
    }
  }
  save();
  return true;
}

/* группы "родитель(и) + дети" для конкретного человека как одного из родителей */
function coParentGroups(personId){
  const groups = new Map(); // key: partnerId || '' -> {partnerId, childIds:[]}
  for (const c of allPersons()){
    if (c.fatherId === personId){
      const key = c.motherId || "";
      if (!groups.has(key)) groups.set(key, {partnerId: c.motherId || null, childIds: []});
      groups.get(key).childIds.push(c.id);
    } else if (c.motherId === personId){
      const key = c.fatherId || "";
      if (!groups.has(key)) groups.set(key, {partnerId: c.fatherId || null, childIds: []});
      groups.get(key).childIds.push(c.id);
    }
  }
  const person = P(personId);
  for (const sid of (person && person.spouseIds || [])){
    if (!groups.has(sid)) groups.set(sid, {partnerId: sid, childIds: []});
  }
  return Array.from(groups.values());
}

/* ---------------------------------------------------------------- */
/* Раскладка древа (SVG)                                            */
/* ---------------------------------------------------------------- */
const SLOT_W = 260, NODE_W = 176, NODE_H = 74, ROW_H = 190, PAD = 20;
/* На сколько ниже карточки идёт родовая перекладина "родители → дети".
   Промежуток между рядами — ROW_H − NODE_H пикселей; перекладина в его
   верхней части, линии далёких супругов — ниже (см. BAND_CHOICES). */
const TRUNK_DROP = 22;

/* Ряд (поколение) для каждого человека — согласование ЧЕТЫРЁХ правил сразу,
   до устойчивого состояния:

     1) ребёнок ровно ниже родителя   — ряд ребёнка > ряда каждого родителя;
     2) супруги — в одном ряду;
     3) родные братья и сёстры — в одном ряду;
     4) родители сидят ВПЛОТНУЮ над детьми — ряд родителя не выше, чем
        (самый верхний ребёнок − 1).

   Четвёртое правило и есть уплотнение. Без него получались пустые провалы:
   человека, женившегося на ком-то из рода с более длинной записанной
   родословной, правило (2) утягивало вниз, а его собственные родители
   оставались наверху — между поколением родителей и их же ребёнком зияло
   несколько пустых рядов, и предок из совсем другого рода оказывался на
   одной строке с чьими-то родителями (Самуил Магид 1888 г. на одной строке
   с Кудрявцевыми 1929 г.).

   Раньше это лечилось сдвигом ВСЕГО рода целиком на разницу. Это неверно:
   ряд человека может задаваться родителем из ДРУГОГО рода (у Александры
   мать из рода Кудрявцевых, а отец — из рода Магид), и сдвиг рода матери
   отрывал её от отца, который никуда не двигался. Правила ниже работают на
   уровне отдельных людей, поэтому такие «смешанные» случаи учитываются сами
   собой.

   Правила 2-4 применяются только там, где они НЕ ПРОТИВОРЕЧАТ кровному
   родству, — см. ниже про несовместимые данные. При этом каждое правило
   только УВЕЛИЧИВАЕТ номер ряда и ограничено сверху числом людей, поэтому
   цикл гарантированно сходится.

   Про несовместимые данные. Опечаткой легко получить связь, при которой
   правила несовместимы в принципе: например, человек записан ОДНОВРЕМЕННО
   отцом и супругом другого. Тогда «ребёнок ниже родителя» требует разных
   рядов, а «супруги в одном ряду» — одинаковых, и наивный цикл наращивает
   номера рядов до бесконечности: дерево уезжало на десятки тысяч пикселей
   вниз, карточки наваливались друг на друга — вместо схемы получалась каша.
   Поэтому кровное родство считается истиной: сначала отдельно считаем
   глубину только по линии родитель → ребёнок, а из правил «супруги/братья в
   одном ряду» выбрасываем те пары, где один приходится другому предком.
   Отдельно выбрасываются рёбра, замыкающие круг (человек оказался
   собственным предком) — иначе невыполнимо даже правило (1). */
function computeRows(){
  const people = allPersons();
  const row = {};
  people.forEach(p => { row[p.id] = 0; });
  if (!people.length) return row;

  // ---- (0) кровные рёбра, из которых убраны замыкающие круг ----------
  const parentsOf = new Map();
  for (const p of people){
    const ps = [];
    for (const pid of [p.fatherId, p.motherId]){
      if (pid && DB.persons[pid] && pid !== p.id) ps.push(pid);
    }
    parentsOf.set(p.id, ps);
  }
  const dropped = new Set(); // "ребёнок|родитель" — ребро, замыкающее круг
  {
    const state = new Map(); // 0/undefined — не тронут, 1 — в текущем пути, 2 — пройден
    for (const start of people){
      if (state.get(start.id)) continue;
      // обход в глубину без рекурсии: на большом дереве рекурсия рискует
      // упереться в предел стека
      const stack = [{ id: start.id, i: 0 }];
      state.set(start.id, 1);
      while (stack.length){
        const top = stack[stack.length - 1];
        const par = (parentsOf.get(top.id) || [])[top.i++];
        if (par === undefined){ state.set(top.id, 2); stack.pop(); continue; }
        const st = state.get(par) || 0;
        if (st === 1){ dropped.add(top.id + "|" + par); continue; } // круг
        if (st === 0){ state.set(par, 1); stack.push({ id: par, i: 0 }); }
      }
    }
  }
  const bloodParents = id => (parentsOf.get(id) || []).filter(par => !dropped.has(id + "|" + par));

  // ---- (1) базовая глубина — только по крови --------------------------
  let changed = true;
  let guard = people.length + 5;
  while (changed && guard-- > 0){
    changed = false;
    for (const p of people){
      for (const par of bloodParents(p.id)){
        const need = row[par] + 1;
        if (need > row[p.id]){ row[p.id] = need; changed = true; }
      }
    }
  }

  // ---- (2) отношение "предок" — чтобы отсеять противоречащие пары -----
  const isAncestor = (anc, desc) => {
    const seen = new Set([desc]);
    const stack = [desc];
    while (stack.length){
      const cur = stack.pop();
      for (const par of bloodParents(cur)){
        if (par === anc) return true;
        if (!seen.has(par)){ seen.add(par); stack.push(par); }
      }
    }
    return false;
  };

  // пары супругов — записанные и через spouseIds, и через общих детей
  const pairKeys = new Set();
  const pairs = [];
  function addPair(a, b){
    if (!a || !b || a === b || !DB.persons[a] || !DB.persons[b]) return;
    const key = [a, b].sort().join("~");
    if (pairKeys.has(key)) return;
    pairKeys.add(key);
    if (isAncestor(a, b) || isAncestor(b, a)) return; // кровь важнее брака
    pairs.push([a, b]);
  }
  // дети каждого человека и группы родных братьев/сестёр
  const kidsOf = new Map();
  for (const p of people){
    for (const sid of (p.spouseIds || [])) addPair(p.id, sid);
    if (p.fatherId && p.motherId) addPair(p.fatherId, p.motherId);
    for (const par of bloodParents(p.id)){
      if (!kidsOf.has(par)) kidsOf.set(par, []);
      kidsOf.get(par).push(p.id);
    }
  }
  // группа братьев и сестёр выравнивается, только если внутри неё никто не
  // приходится другому предком (тоже следствие опечатки в данных)
  const sibGroups = [];
  for (const [, kids] of kidsOf){
    if (kids.length < 2) continue;
    let ok = true;
    for (let i = 0; i < kids.length && ok; i++){
      for (let j = i + 1; j < kids.length; j++){
        if (isAncestor(kids[i], kids[j]) || isAncestor(kids[j], kids[i])){ ok = false; break; }
      }
    }
    if (ok) sibGroups.push(kids);
  }
  const spousesOf = new Map();
  for (const [a, b] of pairs){
    if (!spousesOf.has(a)) spousesOf.set(a, []);
    if (!spousesOf.has(b)) spousesOf.set(b, []);
    spousesOf.get(a).push(b);
    spousesOf.get(b).push(a);
  }

  // Правила 1-3 распространяются СТРОГО вниз по графу крови (а он после
  // отбрасывания замыкающих рёбер ациклический), поэтому сами по себе они
  // всегда сходятся. Правило 4, наоборот, тянет родителей ВНИЗ к детям — и
  // вместе с правилом 1 через цепочку браков оно может замкнуться в петлю с
  // постоянным ростом (родитель вниз → ребёнок вниз → его супруг вниз → его
  // ребёнок вниз → ... → снова первый родитель). На нормальных данных этого
  // не происходит, но одна опечатка способна такую петлю создать.
  // Поэтому: считаем с уплотнением, а если оно НЕ сошлось — берём результат
  // без уплотнения. Пусть лучше между поколениями останется лишний отступ,
  // чем дерево уедет на десятки тысяч пикселей вниз грудой наложенных
  // карточек.
  function relax(useEquality, useCompaction){
    const r = {};
    for (const p of people) r[p.id] = 0;
    let ch = true;
    let g = people.length * (useCompaction ? 4 : 2) + 50;
    while (ch && g-- > 0){
      ch = false;
      // (1) ребёнок ниже каждого родителя
      for (const p of people){
        for (const par of bloodParents(p.id)){
          const need = r[par] + 1;
          if (need > r[p.id]){ r[p.id] = need; ch = true; }
        }
      }
      // (2) супруги в одном ряду
      if (useEquality) for (const [a, b] of pairs){
        const d = Math.max(r[a], r[b]);
        if (r[a] !== d){ r[a] = d; ch = true; }
        if (r[b] !== d){ r[b] = d; ch = true; }
      }
      // (3) родные братья и сёстры в одном ряду
      if (useEquality) for (const kids of sibGroups){
        let d = 0;
        for (const k of kids) d = Math.max(d, r[k]);
        for (const k of kids){ if (r[k] !== d){ r[k] = d; ch = true; } }
      }
      // (4) уплотнение: родитель вплотную над своим самым верхним ребёнком.
      // Супругов двигаем вместе, иначе правило (2) тут же вернёт их назад и
      // цикл будет топтаться на месте.
      if (useCompaction){
        for (const p of people){
          const group = [p.id, ...(spousesOf.get(p.id) || [])];
          let minKid = Infinity;
          for (const gid of group){
            for (const k of (kidsOf.get(gid) || [])) minKid = Math.min(minKid, r[k]);
          }
          if (minKid === Infinity) continue;
          const target = minKid - 1;
          for (const gid of group){
            if (r[gid] < target){ r[gid] = target; ch = true; }
          }
        }
      }
    }
    return { r, converged: !ch };
  }
  // Три уровня, от самого красивого к самому надёжному. Правило "супруги в
  // одном ряду" тоже способно зациклиться в паре с правилом (1): цепочка
  // "брак → ребёнок → брак → ребёнок" может замкнуться в круг, где каждый
  // шаг требует ряда ниже предыдущего, и при этом ни одна пара не связана
  // прямым родством (проверка выше такое не ловит). Последний уровень —
  // только кровные связи: граф уже ациклический, поэтому он сходится всегда.
  let res = relax(true, true);
  if (!res.converged) res = relax(true, false);
  if (!res.converged) res = relax(false, false);
  for (const p of people) row[p.id] = res.r[p.id];

  // ---- (5) последнее слово всегда за кровью ---------------------------
  // если данные всё же оказались противоречивыми и цикл упёрся в
  // предохранитель, ряды могли остаться несогласованными. Дожимаем правило
  // "ребёнок ниже родителя" — пусть лучше будет пустой отступ, чем ребёнок
  // на одной строке с родителем или выше него.
  guard = people.length + 5;
  changed = true;
  while (changed && guard-- > 0){
    changed = false;
    for (const p of people){
      for (const par of bloodParents(p.id)){
        if (row[p.id] <= row[par]){ row[p.id] = row[par] + 1; changed = true; }
      }
    }
  }
  return row;
}

/* ============================================================
   РАСКЛАДКА СЕМЕЙНОГО ДЕРЕВА — пять явных шагов, а не "куда обход дошёл,
   туда и поставили":

   1) buildForest    — складываем всех людей в "лес" независимых
                        родословных деревьев (юнитов). Человек со своими
                        известными родителями ВСЕГДА получает позицию
                        через них, а не через ветку супруга.
   2) computeWidths   — снизу вверх считаем ширину (в "слотах") каждого
                        юнита.
   3) assignCoords    — сверху вниз раздаём x-координаты: родитель ровно
                        по центру над своими детьми, ветки заранее
                        резервируют себе место и никогда не наезжают друг
                        на друга.
   4) attachSpouses   — пары, чьи родословные строились независимо друг
                        от друга, пробуем физически придвинуть друг к
                        другу — но только если точно проверено, что это
                        нигде ни на кого не наложится. Кому не удалось —
                        соединяем прямой веткой, не трогая ничьих координат.
   5) finalize        — неотрицательные координаты, итоговая ширина холста.

   Результат гарантированно без наложений при любой сложности дерева. */
function computeLayout(){
  const rowOf = computeRows();

  // ---- Шаг 1: строим лес юнитов ----------------------------------
  const visited = new Set();
  const processedCouples = new Set();
  const marriageEdges = [];      // {a,b} — супруги, вставшие рядом сразу
  const childEdges = [];         // {parentAId, parentBId, childIds, block}
  const pendingSpouseLinks = []; // {block, anchorId, partnerId} — супруг(а) со своей родословной, кандидат на сближение в шаге 4

  function coupleKey(a, b){ return [a, b].sort().join("~"); }
  function hasKnownParents(id){ const p = P(id); return !!(p && (p.fatherId || p.motherId)); }

  function sortChildrenIds(ids){
    // женатые/замужние — К КРАЮ ряда братьев и сестёр (после всех
    // холостых): свободного места под супруга рядом с self нужен
    // дополнительный слот, и если такого ребёнка поставить в СЕРЕДИНЕ
    // ряда, этот слот со стороны супруга займёт место у СОСЕДНЕГО брата
    // или сестры — и жена/муж окажется зажат(а) между чужими карточками,
    // а не сбоку от своей семьи. Внутри каждой из этих двух групп: сироты-
    // листья (без своей семьи) — раньше тех, у кого уже есть дети, иначе
    // "тяжёлый" по потомкам ребёнок отталкивает братьев/сестёр в сторону.
    return ids.slice().sort((a, b) => {
      const marriedA = (P(a).spouseIds || []).length ? 1 : 0;
      const marriedB = (P(b).spouseIds || []).length ? 1 : 0;
      if (marriedA !== marriedB) return marriedA - marriedB;
      const weightA = children(a).length ? 1 : 0;
      const weightB = children(b).length ? 1 : 0;
      if (weightA !== weightB) return weightA - weightB;
      return (parseInt(yearOf(P(a).birthDate)) || 9999) - (parseInt(yearOf(P(b).birthDate)) || 9999);
    });
  }
  function sortMarriageGroups(groups){
    // более ранний брак (по году рождения первого ребёнка) — левее
    const earliestChildYear = g => g.childIds.length
      ? Math.min(...g.childIds.map(id => parseInt(yearOf(P(id).birthDate)) || 9999))
      : 9999;
    return groups.slice().sort((g1, g2) => earliestChildYear(g1) - earliestChildYear(g2));
  }

  function buildUnit(id){
    if (visited.has(id)) return null;
    visited.add(id);
    const unit = { id, blocks: [] };
    extendChain(id, unit.blocks);
    return unit;
  }
  function extendChain(anchorId, blocksArr){
    for (const g of sortMarriageGroups(coParentGroups(anchorId))){
      // Если у anchor нет своих известных родителей, а у партнёра — есть,
      // не забираем общих детей себе: их правильно заберёт ветка партнёра,
      // когда до неё дойдёт очередь (эта же группа переберётся заново).
      // Иначе детей "супруга без родословной" утаскивало под него, а
      // супруг(а) с настоящими родителями оставался(ась) отдельно от них
      // — и родной брат/сестра оказывались визуально МЕЖДУ мамой и папой.
      if (g.partnerId && P(g.partnerId) && !visited.has(g.partnerId) &&
          !hasKnownParents(anchorId) && hasKnownParents(g.partnerId)){
        continue;
      }
      const key = g.partnerId ? coupleKey(anchorId, g.partnerId) : null;
      if (key){
        if (processedCouples.has(key)) continue;
        processedCouples.add(key);
      }

      let partnerFresh = false;     // партнёр встал рядом сразу
      let partnerElsewhere = false; // у партнёра своя родословная — сблизим в шаге 4, если получится
      if (g.partnerId && P(g.partnerId)){
        // Партнёра ставим рядом СРАЗУ, только если у него самого нет
        // своих известных родителей — тогда ему больше неоткуда взять
        // позицию. Если родители ЕСТЬ, не занимаем его место здесь: пусть
        // его правильно разместит СОБСТВЕННАЯ родительская ветка — связь
        // "ребёнок → его настоящие родители" важнее соседства супругов.
        if (!visited.has(g.partnerId) && !hasKnownParents(g.partnerId)){
          visited.add(g.partnerId);
          partnerFresh = true;
          marriageEdges.push({ a: anchorId, b: g.partnerId });
        } else {
          partnerElsewhere = true;
        }
      }

      const childUnits = [];
      for (const cid of sortChildrenIds(g.childIds)){
        const cu = buildUnit(cid);
        if (cu) childUnits.push(cu);
      }

      const block = { anchorId, partnerId: g.partnerId || null, partnerFresh, partnerElsewhere, childUnits };
      blocksArr.push(block);
      if (partnerElsewhere) pendingSpouseLinks.push({ block, anchorId, partnerId: g.partnerId });
      if (g.childIds.length){
        // block хранится по ссылке: итоговые флаги (получилось ли
        // сблизить супругов) читаются из него в конце шага 4
        childEdges.push({ parentAId: anchorId, parentBId: g.partnerId || null, childIds: childUnits.map(cu => cu.id), block });
      }
      if (partnerFresh) extendChain(g.partnerId, blocksArr); // повторный брак — та же строка
    }
  }

  // Человек без известных родителей, чей супруг(а) — со своей
  // родословной, не должен сканироваться отдельным "корнем": иначе он
  // окажется на краю холста, а к настоящей семье его лишь дотянет
  // длинная линия — и случайный родственник между ними будет выглядеть
  // так, будто "разделяет" супругов. Такого человека подберёт ветка
  // супруга (через partnerFresh) и поставит рядом с ним.
  function hasAncestryfulSpouse(id){
    const spouseIds = new Set(P(id).spouseIds || []);
    for (const c of allPersons()){
      if (c.fatherId === id && c.motherId) spouseIds.add(c.motherId);
      if (c.motherId === id && c.fatherId) spouseIds.add(c.fatherId);
    }
    for (const sid of spouseIds){ if (hasKnownParents(sid)) return true; }
    return false;
  }

  const forest = [];
  const roots = allPersons().filter(p => !p.fatherId && !p.motherId && !hasAncestryfulSpouse(p.id));
  for (const r of roots){ const u = buildUnit(r.id); if (u) forest.push(u); }
  for (const p of allPersons()){ if (!visited.has(p.id)){ const u = buildUnit(p.id); if (u) forest.push(u); } } // подстраховка от битых ссылок на родителей

  // ---- Шаг 1б: выравниваем ряды женатых пар из разных родословных ------
  // rowOf посчитан ТОЛЬКО по своим предкам (см. computeRows) — если у
  // одной стороны брака поколений записано меньше, её нужно целиком
  // сдвинуть вниз (сохраняя разрывы между ЕЁ ЖЕ поколениями), а не просто
  // подтянуть одного человека, оставив его собственных родителей на
  // месте — иначе между ними появляется пустой разрыв в несколько рядов
  // (а чужой, никак не связанный предок мог случайно оказаться на одном
  // ряду с чьими-то родителями).
  //
  // "Своя родословная целиком" — это НЕ произвольная группировка по
  // родитель↔ребёнок рёбрам (общий ребёнок от двух РАЗНЫХ родословных
  // склеил бы их в одну кучу — а это ровно тот случай, ради которого
  // вообще нужно выравнивание). Это именно юнит леса, построенный ШАГОМ
  // ВЫШЕ — там при конфликте общего ребёнка приоритет уже отдан известным
  // предкам, поэтому там границы родов настоящие, а не случайные.
  // partnerId с partnerElsewhere=true — это ЧУЖОЙ человек: он лишь
  // упомянут здесь для центрирования детей, а его настоящее место — в
  // СВОЁМ собственном юните где-то в другом месте леса (у него самого
  // есть известные родители). И rootOf, и membersOf ниже обязаны видеть в
  // нём члена ТОЛЬКО того, чужого дерева — иначе, например, при выравнивании
  // рядов брака (a=его собственное дерево, b=дерево анкора-супруга) он
  // попадал бы в состав ДВИГАЕМОГО дерева партнёра, и на следующем шаге
  // его же собственный ряд снова расходился бы с самим собой — сдвиг
  // применялся бы бесконечно, без сходимости (ряд убегал в тысячи).
  // В membersOf() учитываем только partnerFresh: такому партнёру ДЕЙСТВИТЕЛЬНО
  // больше негде получить позицию, кроме как здесь.
  const rootOf = new Map(); // id -> корневой юнит "леса", которому принадлежит
  (function indexForest(){
    function walk(unit, root){
      rootOf.set(unit.id, root);
      for (const block of unit.blocks){
        if (block.partnerId && block.partnerFresh) rootOf.set(block.partnerId, root);
        for (const cu of block.childUnits) walk(cu, root);
      }
    }
    for (const u of forest) walk(u, u);
  })();
  function membersOf(unit){
    const ids = [];
    (function walk(u){
      ids.push(u.id);
      for (const block of u.blocks){
        if (block.partnerId && block.partnerFresh) ids.push(block.partnerId);
        for (const cu of block.childUnits) walk(cu);
      }
    })(unit);
    return ids;
  }
  // ---- Шаг 1в: роды, связанные браком, — рядом друг с другом ------------
  // Роды выкладываются на холст последовательно, и до сих пор их порядок
  // был случайным (в каком порядке нашлись корни в данных). Из-за этого
  // род жены мог оказаться в противоположном углу холста от рода мужа —
  // между ними зияла пустота, а связь пары приходилось тянуть длинной
  // линией через всё дерево.
  //
  // Раскладываем роды так, чтобы связанные браком стояли соседями. Причём
  // род кладём не «в цепочку от начала», а МЕЖДУ своими связями: половина
  // связанных родов уходит левее, половина правее. Иначе род, в котором
  // живёт самое молодое поколение (а он обычно связан браками сразу с
  // несколькими другими родами — по одному на каждого пришедшего в семью
  // супруга), оказывался с краю холста, и современное поколение читалось
  // как боковая ветка, а не как то, к чему сходится всё дерево.
  (function orderForestByMarriage(){
    const linked = new Map(); // корневой юнит -> Set(смежных корневых юнитов)
    const link = (u, v) => {
      if (!linked.has(u)) linked.set(u, new Set());
      linked.get(u).add(v);
    };
    for (const p of allPersons()){
      const spouses = new Set(p.spouseIds || []);
      for (const c of allPersons()){
        if (c.fatherId === p.id && c.motherId) spouses.add(c.motherId);
        if (c.motherId === p.id && c.fatherId) spouses.add(c.fatherId);
      }
      for (const sid of spouses){
        if (!P(sid)) continue;
        const ru = rootOf.get(p.id), rv = rootOf.get(sid);
        if (ru && rv && ru !== rv){ link(ru, rv); link(rv, ru); }
      }
    }
    const ordered = [];
    const seen = new Set();
    function emit(unit, cameFrom){
      seen.add(unit);
      const nbs = Array.from(linked.get(unit) || []).filter(n => n !== cameFrom && !seen.has(n));
      nbs.forEach(n => seen.add(n)); // резервируем заранее: иначе общий сосед уйдёт в обе половины
      const half = Math.floor(nbs.length / 2);
      for (let i = 0; i < half; i++) emit(nbs[i], unit);
      ordered.push(unit);
      for (let i = half; i < nbs.length; i++) emit(nbs[i], unit);
    }
    // начинаем с самого «связанного» рода — тогда он и окажется в середине
    const byLinks = forest.slice().sort((u, v) =>
      (linked.get(v) ? linked.get(v).size : 0) - (linked.get(u) ? linked.get(u).size : 0));
    for (const start of byLinks){ if (!seen.has(start)) emit(start, null); }
    forest.length = 0;
    forest.push(...ordered);
  })();

  // ---- Шаг 2: ширины снизу вверх ---------------------------------
  // self занимает 1 слот; если рядом реально встаёт партнёр или хотя бы
  // резервируется под него пустое место — плюс 1. Так дети всегда
  // центрируются МЕЖДУ self и этим соседом, а не строго под одним из них.
  function computeWidth(unit){
    let total = 0;
    for (const block of unit.blocks){
      let kidsWidth = 0;
      for (const cu of block.childUnits) kidsWidth += computeWidth(cu);
      block.kidsWidth = kidsWidth;
      const reservesPartnerSlot = block.partnerFresh || block.partnerElsewhere;
      block.width = reservesPartnerSlot ? Math.max(kidsWidth, 2) : kidsWidth;
      total += block.width;
    }
    unit.width = Math.max(total, 1);
    return unit.width;
  }
  for (const u of forest) computeWidth(u);

  // ---- Шаг 3: координаты сверху вниз ------------------------------
  const positions = {};   // id -> {x, depth}
  const coupleSlots = []; // {anchorId, partnerId, x, depth} — пустой слот рядом с self под партнёра; пригодится в шаге 4 и при рендере, даже если сблизить не получится
  function assignCoords(unit, offset){
    if (!unit.blocks.length){
      positions[unit.id] = { x: offset + 0.5, depth: rowOf[unit.id] || 0 };
      return;
    }
    let cursor = offset;
    const floatingSpans = new Map(); // anchorId -> {start,end} — self "плавает" по центру над своими блоками
    const fixedX = new Map();        // anchorId -> x — self стоит впритык к партнёру/слоту, не "плавает"
    for (const block of unit.blocks){
      const blockStart = cursor;
      if (block.partnerFresh || block.partnerElsewhere){
        // дети центрируются внутри зарезервированной ширины блока (МЕЖДУ
        // self и партнёром/его пустым слотом), а не строго под родителем
        const kidsStart = blockStart + (block.width - block.kidsWidth) / 2;
        let kc = kidsStart;
        for (const cu of block.childUnits){ assignCoords(cu, kc); kc += cu.width; }
        const pairCenter = blockStart + block.width / 2;
        fixedX.set(block.anchorId, pairCenter - 0.5);
        if (block.partnerFresh){
          positions[block.partnerId] = { x: pairCenter + 0.5, depth: rowOf[block.partnerId] || 0 };
        } else {
          coupleSlots.push({ anchorId: block.anchorId, partnerId: block.partnerId, x: pairCenter + 0.5, depth: rowOf[block.anchorId] || 0 });
        }
        cursor = blockStart + block.width;
      } else {
        for (const cu of block.childUnits){ assignCoords(cu, cursor); cursor += cu.width; }
        if (!block.childUnits.length) cursor += block.width;
        const span = floatingSpans.get(block.anchorId);
        if (span){ span.start = Math.min(span.start, blockStart); span.end = Math.max(span.end, cursor); }
        else floatingSpans.set(block.anchorId, { start: blockStart, end: cursor });
      }
    }
    for (const [id, x] of fixedX) positions[id] = { x, depth: rowOf[id] || 0 };
    for (const [id, span] of floatingSpans){
      if (fixedX.has(id)) continue; // соседство с партнёром важнее плавающего центра
      positions[id] = { x: (span.start + span.end) / 2, depth: rowOf[id] || 0 };
    }
  }
  const FOREST_GAP = 1.5; // между независимыми родами — зазор пошире, иначе сливаются на глаз
  let canvasCursor = 0;
  for (const u of forest){ assignCoords(u, canvasCursor); canvasCursor += u.width + FOREST_GAP; }
  if (forest.length) canvasCursor -= FOREST_GAP;

  // ---- Шаг 4: сближаем супругов из независимых веток, где безопасно --
  // Супруг(а) со своей родословной уже получил(а) корректную позицию
  // через СВОЁ дерево (шаги 1-3). Чтобы пара стояла рядом, а дети — ровно
  // между ними, пробуем физически подвинуть ВСЮ ветку супруга (вместе со
  // всей его роднёй) вплотную к партнёру. Двигаем только тогда, когда
  // точно проверено: подвинутая ветка нигде не наложится ни на кого из
  // остального дерева. Если наложится — не трогаем ничьи координаты (обе
  // стороны и так корректны, без наложений), а супругов просто соединяем
  // прямой веткой при рендере. (rootOf/membersOf уже построены в шаге 1б.)

  const byDepth = new Map(); // depth -> Map(id -> x), для проверки наложений
  for (const id in positions){
    const pos = positions[id];
    if (!byDepth.has(pos.depth)) byDepth.set(pos.depth, new Map());
    byDepth.get(pos.depth).set(id, pos.x);
  }
  const MIN_GAP = 0.999; // минимум между центрами двух карточек на одном этаже (1 слот = впритык)
  function wouldOverlap(memberIds, dx){
    const members = new Set(memberIds);
    for (const id of memberIds){
      const pos = positions[id];
      if (!pos) continue;
      const bucket = byDepth.get(pos.depth);
      if (!bucket) continue;
      const nx = pos.x + dx;
      for (const [otherId, otherX] of bucket){
        if (members.has(otherId)) continue; // сравниваем только с ЧУЖИМИ позициями
        if (Math.abs(nx - otherX) < MIN_GAP) return true;
      }
    }
    return false;
  }
  function moveUnit(memberIds, dx){
    for (const id of memberIds){
      const pos = positions[id];
      if (!pos) continue;
      const bucket = byDepth.get(pos.depth);
      if (bucket) bucket.delete(id);
      pos.x += dx;
      if (!byDepth.has(pos.depth)) byDepth.set(pos.depth, new Map());
      byDepth.get(pos.depth).set(id, pos.x);
    }
  }

  // Кто с кем уже стоит вплотную как пара (короткая линия брака). Карта
  // пополняется по ходу сближений и служит защитой: ни один последующий
  // сдвиг не имеет права растащить уже сведённую пару. Иначе «линия брака»
  // растягивалась на несколько слотов и шла насквозь через чужие карточки.
  const adjacentSpouses = new Map();
  const marriedTo = id => adjacentSpouses.get(id) || [];
  function noteAdjacent(a, b){
    if (!adjacentSpouses.has(a)) adjacentSpouses.set(a, []);
    if (!adjacentSpouses.has(b)) adjacentSpouses.set(b, []);
    adjacentSpouses.get(a).push(b);
    adjacentSpouses.get(b).push(a);
  }
  for (const e of marriageEdges) noteAdjacent(e.a, e.b);
  // сдвиг набора людей ломает пару, если у кого-то из них супруг остаётся
  // на месте (принадлежит другому, неперемещаемому дереву)
  function wouldSplitCouple(memberIds){
    const moving = new Set(memberIds);
    for (const m of memberIds){
      for (const other of marriedTo(m)){
        if (positions[other] && !moving.has(other)) return true;
      }
    }
    return false;
  }

  const alreadyMoved = new Set();
  const fallbackConnectors = []; // {a,b,pairX} — сблизить не удалось: соединяем прямой веткой, координаты не трогаем
  for (const { block, anchorId, partnerId } of pendingSpouseLinks){
    const partnerRoot = rootOf.get(partnerId);
    const anchorRoot = rootOf.get(anchorId);
    // нельзя двигать дерево само на себя (супруги из одного рода)
    if (!partnerRoot || !anchorRoot || partnerRoot === anchorRoot) continue;
    const anchorPos = positions[anchorId], partnerPos = positions[partnerId];
    if (!anchorPos || !partnerPos) continue;

    // Раньше всегда двигали именно "партнёра" — то есть чисто по тому,
    // с какой стороны обход данных первым наткнулся на этот брак, а не по
    // смыслу. Если у партнёра при этом была своя большая родословная (а у
    // anchor'а — маленькая), пробовали протащить через полдерева огромную
    // ветку — она почти гарантированно на что-то наталкивалась, и пара
    // оставалась далеко друг от друга без всякой причины. Теперь пробуем
    // подвинуть МЕНЬШЕЕ по числу людей дерево — не важно, чьё оно, anchor's
    // или партнёра — так шанс не столкнуться ни с чем много выше; если не
    // получилось, пробуем второе дерево как запасной вариант.
    const partnerMembers = membersOf(partnerRoot);
    const anchorMembers = membersOf(anchorRoot);
    function tryMove(root, members, dx){
      if (alreadyMoved.has(root)) return false;
      if (wouldOverlap(members, dx)) return false;
      if (wouldSplitCouple(members)) return false; // не растаскиваем уже сведённых
      moveUnit(members, dx);
      alreadyMoved.add(root);
      return true;
    }
    // Ставим супруга СПРАВА от партнёра. Пробовать вдобавок и левую сторону
    // заманчиво (на случайных деревьях так удаётся свести больше пар), но
    // проверено — выходит хуже: сближение срабатывает в неудобном месте, и
    // на реальном дереве появляются пересечения линий, которых до этого не
    // было. Лучше оставить пару разъехавшейся и соединить её аккуратной
    // обходной линией, чем свести любой ценой.
    const movePartnerDx = (anchorPos.x + 1) - partnerPos.x;
    const moveAnchorDx = (partnerPos.x - 1) - anchorPos.x;
    const partnerFirst = partnerMembers.length <= anchorMembers.length;
    const attached = partnerFirst
      ? (tryMove(partnerRoot, partnerMembers, movePartnerDx) || tryMove(anchorRoot, anchorMembers, moveAnchorDx))
      : (tryMove(anchorRoot, anchorMembers, moveAnchorDx) || tryMove(partnerRoot, partnerMembers, movePartnerDx));

    if (!attached){
      fallbackConnectors.push({ a: anchorId, b: partnerId, pairX: anchorPos.x + 0.5 });
      continue;
    }
    block.spouseAttached = true;
    // сближение удалось — супруг(а) теперь буквально в соседнем слоте
    // (ровно как partnerFresh), поэтому рисуем ту же короткую линию брака.
    // Без этого пара без общих детей (либо чьи дети целиком достались
    // ветке anchor'а) вообще не имела бы никакой видимой связующей линии —
    // только совпадение в позиции, ничем не объяснимое на глаз.
    marriageEdges.push({ a: anchorId, b: partnerId });
    noteAdjacent(anchorId, partnerId);
  }

  // ---- Шаг 4б: дети — МЕЖДУ далеко стоящими родителями -----------------
  // Если пару свести вплотную не удалось, их общие дети до сих пор висели
  // строго под одним из родителей (под тем, чья ветка их забрала) — и на
  // глаз читались как дети только этого родителя. Сдвигаем весь выводок
  // (вместе с их собственными потомками) на середину между НАСТОЯЩИМИ
  // позициями обоих родителей — снова только если проверено, что это ни на
  // кого не наложится. Не вышло — остаются где были, связь всё равно видна
  // по стволу и линии пары.
  for (const e of fallbackConnectors){
    const posA = positions[e.a], posB = positions[e.b];
    if (!posA || !posB) continue;
    const edge = childEdges.find(ce =>
      (ce.parentAId === e.a && ce.parentBId === e.b) ||
      (ce.parentAId === e.b && ce.parentBId === e.a));
    if (!edge || !edge.block || !edge.block.childUnits.length) continue;
    const kidUnits = edge.block.childUnits;
    const kidMembers = [];
    for (const cu of kidUnits) kidMembers.push(...membersOf(cu));
    const kidXs = kidUnits.map(cu => positions[cu.id]).filter(Boolean).map(p => p.x);
    if (!kidXs.length) continue;
    const kidsCenter = (Math.min(...kidXs) + Math.max(...kidXs)) / 2;
    const dx = (posA.x + posB.x) / 2 - kidsCenter;
    if (Math.abs(dx) < 0.01) continue;
    if (wouldOverlap(kidMembers, dx)) continue;
    // Нельзя двигать выводок, если кто-то из него уже стоит вплотную к
    // своему супругу из ДРУГОГО рода: такой супруг в перемещаемый набор не
    // входит (он принадлежит своему дереву), и сдвиг растащил бы уже
    // сведённую пару. На экране это выглядело как «линия брака» длиной в
    // несколько слотов, проходящая насквозь через чужие карточки.
    if (wouldSplitCouple(kidMembers)) continue;
    moveUnit(kidMembers, dx);
    edge.kidsCentered = true;
  }

  // ---- Шаг 4в: короткая линия брака — только для реально соседних -------
  // Короткая прямая линия уместна, лишь когда супруги стоят вплотную. Если
  // между ними оказались чужие карточки, такая линия пройдёт прямо сквозь
  // них. А стоять вплотную ко ВСЕМ супругам человек и не может: соседей у
  // карточки максимум два, поэтому при повторном браке хотя бы одна пара
  // неизбежно оказывается на расстоянии. Здесь проверяем итоговые
  // координаты и переводим все «разъехавшиеся» пары в связи дальних
  // супругов — те идут по междурядью и карточек не задевают.
  for (let i = marriageEdges.length - 1; i >= 0; i--){
    const e = marriageEdges[i];
    const a = positions[e.a], b = positions[e.b];
    const adjacent = a && b && a.depth === b.depth && Math.abs(a.x - b.x) <= 1.01;
    if (adjacent) continue;
    marriageEdges.splice(i, 1);
    if (a && b) fallbackConnectors.push({ a: e.a, b: e.b });
  }

  // теперь, когда точно известно, кого удалось сблизить, проставляем
  // финальные флаги для рендера стволовых линий и убираем служебную ссылку
  for (const e of childEdges){
    e.parentBAdjacent = !!(e.block.partnerFresh || e.block.spouseAttached);
    e.hasCoupleSlot = !!e.block.partnerElsewhere && !e.block.spouseAttached;
    delete e.block;
  }

  // Подстраховка: обходы выше находят супругов через coParentGroups() —
  // группировку по ОБЩИМ детям и по spouseIds. Если брак записан не с
  // обеих сторон (например, spouseIds проставлен только у одного из
  // супругов, а у общих детей заполнено поле только одного родителя),
  // такая пара могла ни разу не встретиться обходу — и тогда партнёр
  // повисал на дереве вообще БЕЗ единой связующей линии, как будто он
  // сам по себе. Здесь перебираем ВСЕ браки ещё раз, любым способом
  // записанные в данных, и для каждого, у кого до сих пор нет ни короткой
  // линии, ни ветки, — добавляем прямую ветку между их настоящими
  // позициями. Иначе ни один супруг не должен остаться без связи.
  const linkedPairs = new Set();
  for (const e of marriageEdges) linkedPairs.add(coupleKey(e.a, e.b));
  for (const e of fallbackConnectors) linkedPairs.add(coupleKey(e.a, e.b));
  const allRecordedPairs = new Set();
  for (const p of allPersons()){
    for (const sid of (p.spouseIds || [])){ if (P(sid)) allRecordedPairs.add(coupleKey(p.id, sid)); }
  }
  for (const c of allPersons()){
    if (c.fatherId && c.motherId && P(c.fatherId) && P(c.motherId)) allRecordedPairs.add(coupleKey(c.fatherId, c.motherId));
  }
  for (const key of allRecordedPairs){
    if (linkedPairs.has(key)) continue;
    const [aId, bId] = key.split("~");
    if (!positions[aId] || !positions[bId]) continue;
    fallbackConnectors.push({ a: aId, b: bId });
    linkedPairs.add(key);
  }

  // ---- Шаг 5: финализация -----------------------------------------
  // Сближение супругов могло сдвинуть часть дерева влево за край холста.
  // Выравниваем по КРАЮ КАРТОЧКИ, а не по её центру: карточка шире слота и
  // торчит от центра на половину своей ширины в каждую сторону, поэтому
  // человека, попавшего ровно в слот 0, обрезало левым краем холста —
  // карточка начиналась на 68 пикселей левее нуля.
  const allX = Object.values(positions).map(p => p.x);
  if (allX.length){
    const minSlot = Math.min(...allX);
    const minAllowed = (NODE_W / 2) / SLOT_W; // при нём левый край карточки = PAD
    if (minSlot < minAllowed){
      const dx = minAllowed - minSlot;
      for (const id in positions) positions[id].x += dx;
    }
  }
  const rightEdgeSlots = (NODE_W / 2) / SLOT_W; // столько же нужно справа
  const width = Math.max(canvasCursor, ...Object.values(positions).map(p => p.x + rightEdgeSlots));
  const maxDepth = Math.max(0, ...Object.values(rowOf));

  // Род для окраски линий — это ФАМИЛИЯ, а не ветка обхода. Раньше род
  // брался по корневому юниту леса, и получалось не по-человечески: дети
  // Аскаровы, размещённые через свою мать (урождённую Магид), попадали в
  // род Магид и красились с ними одним цветом, хотя это разные фамилии.
  // Мужская и женская формы одной фамилии считаются одним родом, иначе
  // Аскаров и Аскарова оказались бы разного цвета.
  function clanKey(person){
    const raw = (person.lastName || "").trim().toLowerCase();
    if (!raw) return "";
    let s = raw;
    // Новаковская → новаковский, Шувалова → шувалов, Кудрявцева → кудрявцев
    if (/(ская|цкая)$/.test(s)) s = s.replace(/ая$/, "ий");
    else if (/ая$/.test(s)) s = s.replace(/ая$/, "ий");
    else if (/(ов|ев|ёв|ин|ын)а$/.test(s)) s = s.slice(0, -1);
    return s;
  }
  const keyOfPerson = {};
  for (const p of allPersons()) keyOfPerson[p.id] = clanKey(p);
  // Человеку без фамилии род достаётся от супруга или от отца — иначе все
  // безымянные слились бы в один цвет.
  for (const p of allPersons()){
    if (keyOfPerson[p.id]) continue;
    const donors = [...(p.spouseIds || []), p.fatherId, p.motherId];
    for (const d of donors){ if (d && keyOfPerson[d]){ keyOfPerson[p.id] = keyOfPerson[d]; break; } }
  }
  // Цвет получает только тот род, который реально окрашивает хотя бы одну
  // линию. Линия семьи берёт фамилию мужа, поэтому жена, оставившая
  // девичью фамилию, своей линии не даёт — а раньше её фамилия всё равно
  // занимала место в палитре. Из-за этих «пустых» родов настоящим родам
  // доставались повторяющиеся цвета (Самедовы совпадали с Еремиными,
  // Аскаровы — с Башмак-Фаткулиными). Теперь пустые рода цветов не тратят.
  const familyKeyOf = (aId, bId) => {
    const A = aId ? P(aId) : null, B = bId ? P(bId) : null;
    if (A && A.gender === "M" && keyOfPerson[aId]) return keyOfPerson[aId];
    if (B && B.gender === "M" && keyOfPerson[bId]) return keyOfPerson[bId];
    return keyOfPerson[aId] || keyOfPerson[bId] || "";
  };
  const usedKeys = new Set();
  for (const e of marriageEdges) usedKeys.add(familyKeyOf(e.a, e.b));
  for (const e of fallbackConnectors) usedKeys.add(familyKeyOf(e.a, e.b));
  for (const e of childEdges) usedKeys.add(familyKeyOf(e.parentAId, e.parentBId));

  // Порядок цветов — слева направо по холсту: соседние на экране рода
  // получают соседние (то есть разные) цвета палитры.
  const firstX = new Map();
  for (const p of allPersons()){
    const k = keyOfPerson[p.id] || "";
    if (!usedKeys.has(k)) continue;
    const pos = positions[p.id];
    if (!pos) continue;
    if (!firstX.has(k) || pos.x < firstX.get(k)) firstX.set(k, pos.x);
  }
  for (const k of usedKeys){ if (!firstX.has(k)) firstX.set(k, Infinity); }
  const orderedKeys = Array.from(firstX.keys()).sort((a, b) => firstX.get(a) - firstX.get(b));
  const indexOfKey = new Map();
  orderedKeys.forEach((k, i) => indexOfKey.set(k, i));
  // Человеку из «пустого» рода (жена с девичьей фамилией) цвет достаётся от
  // семьи, в которую он входит, — от супруга или от отца.
  const clanOf = {};
  for (const p of allPersons()){
    const own = keyOfPerson[p.id] || "";
    if (indexOfKey.has(own)){ clanOf[p.id] = indexOfKey.get(own); continue; }
    let idx = null;
    for (const sid of (p.spouseIds || [])){
      const k = keyOfPerson[sid];
      if (k && indexOfKey.has(k)){ idx = indexOfKey.get(k); break; }
    }
    if (idx == null){
      for (const pid of [p.fatherId, p.motherId]){
        const k = pid && keyOfPerson[pid];
        if (k && indexOfKey.has(k)){ idx = indexOfKey.get(k); break; }
      }
    }
    clanOf[p.id] = idx == null ? 0 : idx;
  }

  return { positions, marriageEdges, coupleSlots, fallbackConnectors, childEdges, width, maxDepth, clanOf };
}

/* Строит единый список отрезков для отрисовки связей — родовые стволы,
   короткие линии браков и прямые ветки к "далёким" супругам. Общий и для
   renderTree() (экран), и для buildExportSvg() (экспорт в PNG): раньше
   геометрию линий приходилось поддерживать в двух местах вручную, и они
   расходились при каждой правке — теперь координаты считаются один раз,
   а оба рендерера просто рисуют один и тот же список своими средствами
   (HTML/SVG на экране, чистый SVG в экспорте). */
function computeConnectors(layout){
  function px(slotX){ return PAD + slotX * SLOT_W; }
  function py(depth){ return PAD + depth * ROW_H; }
  const segments = [];
  // вырожденные отрезки (обе точки совпали) отбрасываем: в SVG это пустой
  // элемент, который ничего не рисует, но засоряет схему и сбивает проверки
  const clanOf = layout.clanOf || {};
  // Линия пары принадлежит роду, фамилию которого носит семья, — обычно это
  // род мужа. Если пол не указан, берём любого из двоих.
  function coupleClan(aId, bId){
    const A = aId ? P(aId) : null, B = bId ? P(bId) : null;
    if (A && A.gender === "M" && clanOf[aId] != null) return clanOf[aId];
    if (B && B.gender === "M" && clanOf[bId] != null) return clanOf[bId];
    return clanOf[aId] != null ? clanOf[aId] : clanOf[bId];
  }
  // caждый отрезок помечается номером рода — по нему при отрисовке
  // выбирается цвет, чтобы ветви разных родословных не сливались
  const addLine = (x1, y1, x2, y2, clan) => {
    if (Math.abs(x1 - x2) < 0.01 && Math.abs(y1 - y2) < 0.01) return;
    segments.push({ type: "line", x1, y1, x2, y2, clan: clan || 0 });
  };

  // короткие линии браков — супруги стоят рядом. Рисуем строго ОТ КРАЯ до
  // КРАЯ карточек, а не от центра к центру: отрезок, уходящий внутрь
  // карточки, не виден (карточки рисуются поверх линий), но делает
  // невозможной строгую проверку "ни одна линия не проходит сквозь чужую
  // карточку" — а такие сквозные линии как раз и есть главный источник
  // визуальной путаницы на большом дереве.
  for (const e of layout.marriageEdges){
    const a = layout.positions[e.a], b = layout.positions[e.b];
    if (!a || !b) continue;
    const y = py(a.depth) + NODE_H / 2;
    const goingRight = b.x >= a.x;
    const ax = px(a.x) + (goingRight ? NODE_W / 2 : -NODE_W / 2);
    const bx = px(b.x) + (goingRight ? -NODE_W / 2 : NODE_W / 2);
    addLine(ax, y, bx, y, coupleClan(e.a, e.b));
  }

  // ---- классифицируем связи разъехавшихся пар --------------------------
  // Пара могла разъехаться по двум причинам: её не удалось свести вплотную,
  // либо у человека несколько браков (соседей у карточки всего два, поэтому
  // ко всем супругам вплотную встать невозможно). Связь ведём по-разному:
  //   • если между супругами в их ряду НИКОГО нет — прямой линией на высоте
  //     карточек, как у обычной пары: коротко, ничего не задевает;
  //   • иначе — в обход по междурядью, и дети такой пары вешаются прямо на
  //     эту линию (иначе линия пары шла бы своей высотой и пересекала все
  //     спуски к детям, превращая схему в решётку).
  const coupleKeyOf = (a, b) => [a, b].sort().join("~");
  const childEdgeByCouple = new Map();
  for (const e of layout.childEdges){
    if (e.parentBId) childEdgeByCouple.set(coupleKeyOf(e.parentAId, e.parentBId), e);
  }
  const rowOccupants = new Map();
  for (const id in layout.positions){
    const p = layout.positions[id];
    if (!rowOccupants.has(p.depth)) rowOccupants.set(p.depth, []);
    rowOccupants.get(p.depth).push({ id, x: p.x });
  }
  const directPairs = [], bandedPairs = [];
  for (const e of layout.fallbackConnectors){
    const a = layout.positions[e.a], b = layout.positions[e.b];
    if (!a || !b || e.a === e.b) continue;
    const lo = Math.min(a.x, b.x), hi = Math.max(a.x, b.x);
    const clearRow = a.depth === b.depth && hi - lo > 0.01 &&
      !(rowOccupants.get(a.depth) || []).some(o =>
        o.id !== e.a && o.id !== e.b && o.x > lo + 0.01 && o.x < hi - 0.01);
    (clearRow ? directPairs : bandedPairs).push(e);
  }
  const directCouples = new Set(directPairs.map(e => coupleKeyOf(e.a, e.b)));
  const handledByConnector = new Set(); // дети подвешиваются к линии пары
  for (const e of bandedPairs){
    const ce = childEdgeByCouple.get(coupleKeyOf(e.a, e.b));
    if (ce) handledByConnector.add(ce);
  }

  // ---- родовые стволы: они же задают "занятые" вертикали ----------------
  // Порядок важен: высоту обходной линии выбираем так, чтобы она пересекла
  // как можно меньше вертикалей, — а для этого их нужно знать заранее.
  const verticals = []; // {x, y1, y2} — препятствия для горизонтальных линий
  const coupleSlotByKey = new Map();
  for (const cs of layout.coupleSlots) coupleSlotByKey.set(cs.anchorId + "~" + cs.partnerId, cs.x);
  for (const e of layout.childEdges){
    if (handledByConnector.has(e)) continue; // нарисуем вместе с линией пары
    const posA = layout.positions[e.parentAId];
    if (!posA) continue;
    // Второй родитель стоит рядом — центрируем ствол между настоящими
    // карточками обоих. Если он размещён далеко, центрируем по его
    // ЗАРЕЗЕРВИРОВАННОМУ пустому слоту рядом с этим родителем, а НЕ по его
    // далёкой настоящей позиции: тянуть перекладину через полхолста — это
    // длинная горизонталь поперёк всего дерева.
    const isDirect = e.parentBId && directCouples.has(coupleKeyOf(e.parentAId, e.parentBId));
    let posBx = null;
    if (e.parentBId && layout.positions[e.parentBId] &&
        (e.parentBAdjacent || e.kidsCentered || isDirect)){
      // родители реально рядом, либо детей физически передвинули на середину
      // между ними (шаг 4б), либо между супругами пусто и связь прямая —
      // во всех трёх случаях середина берётся по настоящим позициям
      posBx = layout.positions[e.parentBId].x;
    } else if (e.hasCoupleSlot){
      posBx = coupleSlotByKey.get(e.parentAId + "~" + e.parentBId);
    }
    const midX = (posBx != null) ? (px(posA.x) + px(posBx)) / 2 : px(posA.x);
    const parentBottomY = py(posA.depth) + NODE_H;
    const trunkY = parentBottomY + TRUNK_DROP;
    const kidPositions = e.childIds.map(cid => layout.positions[cid]).filter(Boolean);
    if (!kidPositions.length) continue;
    const kidXs = kidPositions.map(pos => px(pos.x));
    // Ствол должен выходить ИЗ КАРТОЧКИ. По середине между родителями его
    // можно опускать, только когда второй родитель действительно стоит
    // рядом: тогда точка входа зажата между двумя карточками и читается как
    // общая. Если же второй родитель далеко (или вместо него лишь
    // зарезервированное пустое место), середина оказывается в пустоте — и
    // ствол повисал в воздухе, начинаясь ни от чего. В этом случае опускаем
    // его от карточки самого родителя, а до детей дотягивается перекладина.
    const stemX = (e.parentBAdjacent && posBx != null) ? midX : px(posA.x);
    // Ветка «родители → дети» принадлежит роду СЕМЬИ — то есть отца, чью
    // фамилию носят дети. Брать род первого ребёнка нельзя: дочь, вышедшая
    // замуж, носит уже фамилию мужа, и ветка родителей окрасилась бы в цвет
    // чужого рода.
    const clan = coupleClan(e.parentAId, e.parentBId);
    addLine(stemX, parentBottomY, stemX, trunkY, clan);    // ствол вниз от родителей
    verticals.push({ x: stemX, y1: parentBottomY, y2: trunkY });
    const barMinX = Math.min(stemX, ...kidXs), barMaxX = Math.max(stemX, ...kidXs);
    addLine(barMinX, trunkY, barMaxX, trunkY, clan);       // перекладина
    for (const pos of kidPositions){
      addLine(px(pos.x), trunkY, px(pos.x), py(pos.depth), clan); // спуск к каждому ребёнку
      verticals.push({ x: px(pos.x), y1: trunkY, y2: py(pos.depth) });
    }
  }

  // ---- прямые связи: между супругами в ряду никого нет -------------------
  for (const e of directPairs){
    const a = layout.positions[e.a], b = layout.positions[e.b];
    const y = py(a.depth) + NODE_H / 2;
    const goingRight = b.x >= a.x;
    addLine(px(a.x) + (goingRight ? NODE_W/2 : -NODE_W/2), y,
            px(b.x) + (goingRight ? -NODE_W/2 : NODE_W/2), y, coupleClan(e.a, e.b));
  }

  // ---- обходные связи: линия пары И ЕСТЬ перекладина её детей ------------
  // Любая длинная горизонталь в промежутке между рядами пересекает
  // вертикальные спуски чужих семей, попавшие в её пролёт. Перебираем
  // несколько допустимых высот и берём ту, где пересечений меньше всего.
  // Высоты в междурядье, в порядке предпочтения. Промежуток между рядами —
  // 116 px; вверху него (22 px) идут родовые перекладины, поэтому линия пары
  // должна быть заметно ниже. При этом прижимать её к следующему ряду тоже
  // нельзя: на 96 px до карточек оставалось всего 20 px, и линия читалась
  // как приклеенная к ним. 60 px — примерно посередине свободной части.
  const BAND_CHOICES = [60, 88, 38, 104, 46, 72, 96, 30];
  const placedBands = []; // {y, x1, x2} — уже занятые горизонтали в междурядье
  for (const e of bandedPairs){
    const a = layout.positions[e.a], b = layout.positions[e.b];
    const ce = childEdgeByCouple.get(coupleKeyOf(e.a, e.b));
    const kidPositions = ce ? ce.childIds.map(id => layout.positions[id]).filter(Boolean) : [];
    const kidXs = kidPositions.map(p => px(p.x));
    const ax = px(a.x), bx = px(b.x);
    const baseY = Math.max(py(a.depth), py(b.depth)) + NODE_H;
    const leftX = Math.min(ax, bx, ...kidXs), rightX = Math.max(ax, bx, ...kidXs);
    // Высоту подбираем так, чтобы линия, во-первых, НЕ ЛЕГЛА НА ДРУГУЮ такую
    // же (две пары, попавшие на одну высоту, рисовались буквально одна
    // поверх другой — на экране это выглядело как одна линия, ведущая сразу
    // ко всем, и разобрать, кто с кем, было невозможно), и во-вторых —
    // пересекала как можно меньше вертикальных спусков чужих семей.
    // Наложение штрафуем несравнимо сильнее пересечения: пересечение
    // читается, слияние — нет.
    let bandY = baseY + BAND_CHOICES[0], best = Infinity;
    for (const off of BAND_CHOICES){
      const y = baseY + off;
      let penalty = 0;
      for (const bnd of placedBands){
        if (Math.abs(bnd.y - y) > 0.5) continue;
        if (Math.min(bnd.x2, rightX) - Math.max(bnd.x1, leftX) > 1) penalty += 1000;
      }
      for (const v of verticals){
        if (v.x > leftX + 1 && v.x < rightX - 1 && y > Math.min(v.y1,v.y2) + 1 && y < Math.max(v.y1,v.y2) - 1) penalty++;
      }
      if (penalty < best){ best = penalty; bandY = y; }
      if (!penalty) break;
    }
    const clan = coupleClan(e.a, e.b);
    addLine(ax, py(a.depth) + NODE_H, ax, bandY, clan);    // спуск от одного супруга
    addLine(bx, py(b.depth) + NODE_H, bx, bandY, clan);    // спуск от другого
    addLine(leftX, bandY, rightX, bandY, clan);            // общая перекладина пары
    placedBands.push({ y: bandY, x1: leftX, x2: rightX });
    verticals.push({ x: ax, y1: py(a.depth) + NODE_H, y2: bandY });
    verticals.push({ x: bx, y1: py(b.depth) + NODE_H, y2: bandY });
    for (const p of kidPositions){
      addLine(px(p.x), bandY, px(p.x), py(p.depth), clan); // дети висят на ней
      verticals.push({ x: px(p.x), y1: bandY, y2: py(p.depth) });
    }
  }

  // ---- мостики на пересечениях ------------------------------------------
  // Там, где горизонталь пересекает чужую вертикаль, рисуем не крест, а
  // «мостик»: горизонталь делает маленькую дугу поверх вертикали. Так сразу
  // видно, что линии именно ПЕРЕСЕКАЮТСЯ, а не соединяются в этой точке, —
  // без мостика перекрестье читается как развилка, и понять, куда ведёт
  // каждая ветвь, невозможно. Приём стандартный для схем и чертежей.
  const HOP_R = 5;
  const vertSegs = segments.filter(s => s.type === "line" && Math.abs(s.x1 - s.x2) < 0.5);
  const withHops = [];
  for (const s of segments){
    const isH = s.type === "line" && Math.abs(s.y1 - s.y2) < 0.5;
    if (!isH){ withHops.push(s); continue; }
    const y = s.y1;
    const lo = Math.min(s.x1, s.x2), hi = Math.max(s.x1, s.x2);
    const xs = [];
    for (const v of vertSegs){
      const vTop = Math.min(v.y1, v.y2), vBot = Math.max(v.y1, v.y2);
      if (v.x1 > lo + HOP_R && v.x1 < hi - HOP_R && y > vTop + 0.5 && y < vBot - 0.5) xs.push(v.x1);
    }
    if (!xs.length){ withHops.push(s); continue; }
    xs.sort((a, b) => a - b);
    let d = "M " + lo + " " + y;
    for (const xc of xs){
      d += " L " + (xc - HOP_R) + " " + y +
           " A " + HOP_R + " " + HOP_R + " 0 0 1 " + (xc + HOP_R) + " " + y;
    }
    d += " L " + hi + " " + y;
    // сохраняем и прямые координаты: для всех проверок и расчётов это
    // по-прежнему обычный горизонтальный отрезок, дуги — только отрисовка
    withHops.push({ type: "path", d, clan: s.clan, x1: lo, y1: y, x2: hi, y2: y, hops: xs.length });
  }
  return withHops;
}

/* Цвет линии по номеру рода. Родов может быть больше, чем цветов в
   палитре, поэтому номера идут по кругу — соседние рода при этом всё равно
   получают разные цвета, так как выкладываются подряд. */
const CLAN_COLOR_COUNT = 20;
function clanStroke(clan){
  return "var(--clan-" + ((((clan | 0) % CLAN_COLOR_COUNT) + CLAN_COLOR_COUNT) % CLAN_COLOR_COUNT + 1) + ")";
}

function svgEl(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

let currentHighlightId = null;

function renderTree(){
  const svg = document.getElementById("treeSvg");
  const empty = document.getElementById("emptyState");
  const scrollWrap = document.getElementById("treeScroll");
  const people = allPersons();
  document.getElementById("peopleCount").textContent = people.length ? (people.length + " чел.") : "";

  if (!people.length){
    empty.hidden = false;
    svg.innerHTML = "";
    svg.setAttribute("width", 0);
    svg.setAttribute("height", 0);
    return;
  }
  empty.hidden = true;

  const layout = computeLayout();
  const totalW = Math.max(layout.width, 1) * SLOT_W + PAD*2;
  const totalH = (layout.maxDepth + 1) * ROW_H + PAD*2;
  svg.setAttribute("width", totalW);
  svg.setAttribute("height", totalH);
  svg.setAttribute("viewBox", "0 0 " + totalW + " " + totalH);
  svg.innerHTML = "";

  function px(slotX){ return PAD + slotX * SLOT_W; }
  function py(depth){ return PAD + depth * ROW_H; }

  const linesLayer = svgEl("g", {});
  const nodesLayer = svgEl("g", {});
  svg.appendChild(linesLayer);
  svg.appendChild(nodesLayer);

  // все связи (родовые стволы, короткие линии браков, прямые ветки к
  // "далёким" супругам) — единым списком из computeConnectors(), тем же,
  // что рисует и экспорт в PNG, единым стилем без исключений
  for (const seg of computeConnectors(layout)){
    if (seg.type === "line"){
      linesLayer.appendChild(svgEl("line", { x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2, stroke: clanStroke(seg.clan), "stroke-width": 2 }));
    } else {
      const d = seg.d || seg.points.map((pt, i) => (i === 0 ? "M " : "L ") + pt[0] + " " + pt[1]).join(" ");
      linesLayer.appendChild(svgEl("path", { d, fill: "none", stroke: clanStroke(seg.clan), "stroke-width": 2 }));
    }
  }

  // узлы людей
  for (const p of people){
    const pos = layout.positions[p.id];
    if (!pos) continue;
    const x = px(pos.x) - NODE_W/2;
    const y = py(pos.depth);
    const fo = svgEl("foreignObject", { x, y, width: NODE_W, height: NODE_H + 40 });
    const div = document.createElement("div");
    let cls = "node-box " + genderClass(p);
    if (p.deathDate) cls += " dead";
    if (currentHighlightId && currentHighlightId === p.id) cls += " highlight";
    div.className = cls;
    div.style.width = NODE_W + "px";
    div.style.minHeight = NODE_H + "px";

    const spouseNames = (p.spouseIds||[]).map(sid => P(sid)).filter(Boolean).map(s => "⚭ " + fullName(s));
    div.innerHTML =
      '<div class="nm">' + escapeHtml(fullName(p)) + (p.deathDate ? " †" : "") + '</div>' +
      (p.maidenName ? '<div class="mn">урожд. ' + escapeHtml(p.maidenName) + '</div>' : "") +
      (lifeSpan(p) ? '<div class="dt">' + escapeHtml(lifeSpan(p)) + '</div>' : "") +
      (p.birthPlace ? '<div class="pl">📍 ' + escapeHtml(p.birthPlace) + '</div>' : "") +
      (spouseNames.length ? '<div class="sp">' + escapeHtml(spouseNames.join(", ")) + '</div>' : "");
    div.addEventListener("click", () => openDetail(p.id));
    fo.appendChild(div);
    nodesLayer.appendChild(fo);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
