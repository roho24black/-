<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<title>Что? Где? Когда? — пульт ведущего</title>
<style>
  :root{
    --bg:#0a0c09;
    --bg2:#111309;
    --felt-a:#0f2a1c;
    --felt-b:#0a2016;
    --card:#161a13;
    --card-2:#1d2318;
    --gold:#c9a227;
    --gold-light:#eccd6a;
    --gold-dim:#8a712a;
    --red:#8c2222;
    --red-light:#d0453a;
    --text:#f3ecd8;
    --muted:#a9a08a;
    --ring-bg:#2a2a20;
    --shadow:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100dvh;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(201,162,39,.10), transparent 55%),
      radial-gradient(ellipse at 100% 0%, rgba(201,162,39,.06), transparent 45%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color:var(--text);
    font-family: Georgia, 'Times New Roman', 'PT Serif', serif;
    display:flex; flex-direction:column; align-items:stretch;
    user-select:none; -webkit-user-select:none;
    overflow-x:hidden;
  }
  #app{ flex:1; display:flex; flex-direction:column; }
  .wrap{ max-width:640px; margin:0 auto; width:100%; padding:14px 16px calc(18px + env(safe-area-inset-bottom)); flex:1; display:flex; flex-direction:column; }

  header.top{
    display:flex; align-items:center; gap:10px; justify-content:center;
    padding:12px 16px 6px; text-align:center;
  }
  header.top .owl{ width:34px; height:34px; flex:none; }
  header.top h1{
    font-size:clamp(16px,4.4vw,22px); margin:0; letter-spacing:.04em;
    font-weight:700; color:var(--gold-light);
    text-shadow:0 1px 0 rgba(0,0,0,.5);
  }

  .card{
    background:linear-gradient(180deg, var(--card-2), var(--card));
    border:1px solid rgba(201,162,39,.25);
    border-radius:16px;
    box-shadow:0 10px 30px var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
    padding:18px 16px;
  }

  h2.section-title{
    font-size:clamp(15px,3.6vw,18px); color:var(--gold-light); margin:0 0 12px;
    text-align:center; letter-spacing:.03em; font-weight:700;
  }

  label.field-label{ display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; font-family: -apple-system, system-ui, sans-serif;}
  input[type=text], input[type=number]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(201,162,39,.35);
    background:#0d100b; color:var(--text); font-size:16px; font-family: -apple-system, system-ui, sans-serif;
  }
  input:focus{ outline:2px solid var(--gold); }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:58px; padding:12px 18px; border-radius:14px; border:none;
    font-size:clamp(15px,4vw,17px); font-weight:700; cursor:pointer;
    font-family: -apple-system, system-ui, sans-serif; letter-spacing:.01em;
    transition:transform .08s ease, filter .15s ease, opacity .15s ease;
    -webkit-user-select:none;
  }
  .btn:active{ transform:scale(.97); }
  .btn[disabled]{ opacity:.45; pointer-events:none; }
  .btn-gold{ background:linear-gradient(180deg, var(--gold-light), var(--gold-dim)); color:#211a05; box-shadow:0 6px 18px rgba(201,162,39,.25);}
  .btn-ghost{ background:transparent; color:var(--gold-light); border:1.5px solid rgba(201,162,39,.5); }
  .btn-outline{ background:rgba(255,255,255,.04); color:var(--text); border:1px solid rgba(255,255,255,.14); }
  .btn-experts{ background:linear-gradient(180deg,#2f6b3a,#1c4325); color:#eafff0; box-shadow:0 6px 18px rgba(47,107,58,.35);}
  .btn-viewers{ background:linear-gradient(180deg,var(--red-light),var(--red)); color:#fff0ee; box-shadow:0 6px 18px rgba(140,34,34,.35);}
  .btn-sm{ min-height:44px; font-size:13px; padding:8px 14px; border-radius:10px; }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:10px; }

  .muted{ color:var(--muted); font-family:-apple-system, system-ui, sans-serif; font-size:13px; }
  .center{ text-align:center; }

  /* ---------- setup ---------- */
  .setup-stack{ display:flex; flex-direction:column; gap:6px; margin-top:6px;}
  .pool-stat{ text-align:center; font-family:-apple-system, system-ui, sans-serif; font-size:12.5px; color:var(--muted); margin-top:10px;}
  .banner{
    background:rgba(201,162,39,.12); border:1px solid rgba(201,162,39,.4); color:var(--gold-light);
    border-radius:10px; padding:10px 12px; font-size:13px; font-family:-apple-system, system-ui, sans-serif;
    margin:10px 0; text-align:center;
  }

  /* ---------- scoreboard ---------- */
  .scoreboard{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:radial-gradient(ellipse at center, var(--felt-a), var(--felt-b));
    border:1px solid rgba(201,162,39,.3); border-radius:14px; padding:10px 14px; margin-bottom:14px;
    box-shadow:inset 0 0 30px rgba(0,0,0,.4);
  }
  .score-side{ text-align:center; flex:1; }
  .score-side .label{ font-size:11px; letter-spacing:.08em; color:var(--muted); font-family:-apple-system,system-ui,sans-serif; text-transform:uppercase;}
  .score-side .num{ font-size:clamp(26px,7vw,34px); font-weight:800; line-height:1.1; }
  .score-side.experts .num{ color:#78d78e; }
  .score-side.viewers .num{ color:#ef8378; }
  .score-mid{ font-size:20px; color:var(--gold); opacity:.7; font-weight:400; }
  .round-counter{ text-align:center; font-family:-apple-system,system-ui,sans-serif; font-size:12.5px; color:var(--muted); margin-bottom:10px; letter-spacing:.03em;}

  /* ---------- wheel ---------- */
  .wheel-zone{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:10px 0 4px; }
  .wheel-outer{ position:relative; width:min(72vw,300px); height:min(72vw,300px); }
  .wheel-face{
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 50% 45%, #1a2f1f 0%, #0f2116 60%, #0a170f 100%);
    border:6px solid var(--gold-dim);
    box-shadow:0 10px 30px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.55);
  }
  .wheel-num{
    position:absolute; top:50%; left:50%; width:30px; height:30px; margin:-15px;
    display:flex; align-items:center; justify-content:center;
    transform: rotate(calc(var(--i) * (360deg/13))) translate(0, calc(-1 * (min(72vw,300px) / 2 - 26px))) rotate(calc(-1 * var(--i) * (360deg/13)));
    font-family:-apple-system,system-ui,sans-serif; font-weight:700; font-size:14px; color:var(--gold-light);
  }
  .wheel-num.b13{ color:#ffd76a; font-size:12px; background:radial-gradient(circle, rgba(255,215,106,.25), transparent 70%); border-radius:50%; }
  .wheel-hub{
    position:absolute; top:50%; left:50%; width:22px; height:22px; margin:-11px;
    border-radius:50%; background:radial-gradient(circle, var(--gold-light), var(--gold-dim));
    box-shadow:0 2px 8px rgba(0,0,0,.5); z-index:3;
  }
  .wheel-arrow{
    position:absolute; top:50%; left:50%; width:8px; height:calc(min(72vw,300px)/2 - 14px);
    margin-left:-4px; margin-top:calc(-1 * (min(72vw,300px)/2 - 14px));
    transform-origin:50% 100%;
    transform:rotate(0deg);
    transition: transform 3.2s cubic-bezier(.14,.85,.28,1);
    z-index:2;
  }
  .wheel-arrow::before{
    content:''; position:absolute; left:50%; top:0; width:0; height:0; margin-left:-11px;
    border-left:11px solid transparent; border-right:11px solid transparent; border-bottom:26px solid var(--gold-light);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
  }
  .wheel-arrow::after{
    content:''; position:absolute; left:50%; bottom:-6px; width:14px; height:100%; margin-left:-3px; width:6px;
    background:linear-gradient(180deg, var(--gold-light), var(--gold-dim));
    border-radius:3px;
  }

  /* ---------- flavor ---------- */
  .flavor-card{ text-align:center; padding:22px 16px; }
  .flavor-card .from{ font-size:13px; color:var(--muted); font-family:-apple-system,system-ui,sans-serif; margin-bottom:6px;}
  .flavor-card .who{ font-size:clamp(17px,5vw,21px); color:var(--gold-light); font-weight:700; }
  .flavor-card .city{ font-size:clamp(15px,4.4vw,18px); color:var(--text); margin-top:4px; }

  /* ---------- question ---------- */
  .question-text{
    font-size:clamp(18px,5.4vw,23px); line-height:1.5; text-align:center; padding:6px 4px 4px;
  }
  .qmeta{ text-align:center; margin-top:14px; font-family:-apple-system,system-ui,sans-serif; font-size:12px; color:var(--muted); }

  /* ---------- timer ---------- */
  .timer-zone{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:8px 0; }
  .timer-ring-wrap{ position:relative; width:min(58vw,240px); height:min(58vw,240px); }
  .timer-ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .timer-ring-bg{ fill:none; stroke:var(--ring-bg); stroke-width:12; }
  .timer-ring-fg{ fill:none; stroke:var(--gold); stroke-width:12; stroke-linecap:round; transition:stroke .3s ease; }
  .timer-digits{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:clamp(38px,11vw,56px); font-weight:800; font-family:-apple-system,system-ui,sans-serif;
  }
  .timer-ring-fg.warn{ stroke:#e0b23a; }
  .timer-ring-fg.danger{ stroke:var(--red-light); }
  .timer-digits.danger{ color:var(--red-light); }
  .debt-note{ text-align:center; font-size:12px; color:#e0b23a; font-family:-apple-system,system-ui,sans-serif; }

  /* ---------- answer ---------- */
  .answer-block{ text-align:center; }
  .answer-label{ font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-family:-apple-system,system-ui,sans-serif;}
  .answer-text{ font-size:clamp(19px,5.6vw,24px); color:var(--gold-light); font-weight:700; margin:6px 0 14px; }
  .accept-text{ font-size:13px; color:var(--muted); font-family:-apple-system,system-ui,sans-serif; margin-top:-8px; margin-bottom:14px;}
  .comment-text{ font-size:15px; line-height:1.5; color:var(--text); text-align:left; background:rgba(255,255,255,.03); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
  .attribution{ font-size:12px; color:var(--muted); font-family:-apple-system,system-ui,sans-serif; text-align:left; line-height:1.6; }

  .score-buttons{ display:flex; gap:14px; margin-top:18px; }
  .score-buttons .btn{ flex:1; flex-direction:column; min-height:74px; }
  .score-buttons .btn small{ font-weight:400; opacity:.85; font-size:11px; }

  .undo-bar{ display:flex; justify-content:center; margin-top:10px; }

  /* ---------- action bar ---------- */
  .action-bar{ margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .secondary-row{ display:flex; gap:10px; }
  .secondary-row .btn{ flex:1; }

  /* ---------- summary ---------- */
  .final-score{ text-align:center; padding:8px 0 6px; }
  .final-score .big{ font-size:clamp(40px,13vw,60px); font-weight:800; }
  .final-score .who{ font-size:14px; color:var(--muted); font-family:-apple-system,system-ui,sans-serif; margin-top:4px;}
  .result-list{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .result-row{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px;
    background:rgba(255,255,255,.03); font-family:-apple-system,system-ui,sans-serif; font-size:13px;
  }
  .result-row .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .result-row .dot.ok{ background:#78d78e; }
  .result-row .dot.no{ background:#ef8378; }
  .result-row .qn{ color:var(--muted); flex:none; width:20px; }
  .result-row .qt{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .owl-watermark{ position:fixed; right:-30px; bottom:-30px; width:220px; opacity:.03; pointer-events:none; z-index:0;}

  ::selection{ background: rgba(201,162,39,.35); }
</style>
</head>

/* =========================================================================
   2. СОСТОЯНИЕ
   ========================================================================= */
const STORAGE_KEY = 'chgk_host_state_v1';

function freshState(){
  return {
    phase:'setup',
    roundPhase:'intro',
    teamName:'',
    timerDuration:60,
    questions:[],
    currentIndex:0,
    activeSlot:null,
    scoreExperts:0,
    scoreViewers:0,
    results:[],
    playedQuestionIds:[],
    playedBonusIndexes:[],
    wheelRotation:0,
    remainingNumbers:[],
    timeDebt:0,
    justResetPool:false,
    justResetBonusPool:false,
    currentBonus:null,
    early:false,
    earlySeconds:null,
    undoSnapshot:null,
  };
}

let state = freshState();

function safeLoad(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved && typeof saved === 'object'){
      state = Object.assign(freshState(), saved);
      // никогда не восстанавливаем игру "в процессе" с активным таймером - только пройденный прогресс
      if(state.phase === 'round'){
        // безопасно вернуть на экран настройки, чтобы не тащить сломанный таймер между сессиями
        if(state.roundPhase === 'timerRunning' || state.roundPhase === 'timerPaused'){
          state.roundPhase = 'question';
        }
      }
    }
  }catch(e){ /* localStorage недоступен - остаёмся на in-memory состоянии */ }
}
function safeSave(){
  try{
    const {undoSnapshot, ...toSave} = state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }catch(e){ /* best-effort, игнорируем */ }
}

/* =========================================================================
   3. ЗВУК (Web Audio API, без внешних файлов)
   ========================================================================= */
let audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){ /* звук недоступен - игра продолжается без него */ }
  return audioCtx;
}
function tone(freq, startAt, dur, opts){
  opts = opts || {};
  if(!audioCtx) return;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.value = freq;
    const peak = opts.peak != null ? opts.peak : 0.22;
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.exponentialRampToValueAtTime(peak, startAt + (opts.attack || 0.02));
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + (opts.decay != null ? opts.decay : 0.5));
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(startAt);
    osc.stop(startAt + (opts.decay != null ? opts.decay : 0.5) + 0.05);
  }catch(e){}
}
function playStartTone(){
  const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  tone(880, t, 0.15, {decay:0.16, peak:0.2});
  tone(1320, t + 0.09, 0.14, {decay:0.14, peak:0.14});
}
function playTick(){
  const ctx = ensureAudio(); if(!ctx) return;
  tone(660, ctx.currentTime, 0.06, {decay:0.08, peak:0.08});
}
function playEndGong(){
  const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  [220, 330, 440].forEach((f,i)=>{
    tone(f, t + i*0.03, 1.6, {type:'triangle', decay:1.7, peak:0.18, attack:0.01});
  });
}

/* =========================================================================
   4. ХЕЛПЕРЫ
   ========================================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(s){ return esc(s).replace(/\n+/g,'<br>'); }

/* =========================================================================
   5. СБОРКА ИГРЫ
   ========================================================================= */
function drawGame(){
  let pool = QUESTIONS.filter(q => state.playedQuestionIds.indexOf(q.id) === -1);
  let poolReset = false;
  if(pool.length < 12){
    state.playedQuestionIds = [];
    pool = QUESTIONS.slice();
    poolReset = true;
  }
  const chosen = shuffle(pool).slice(0, Math.min(12, pool.length));
  const cities = shuffle(CITIES);
  const senders = shuffle(SENDERS);

  state.questions = chosen.map((q, i) => ({
    ...q,
    _city: q.city || cities[i % cities.length],
    _sender: q.sender || senders[i % senders.length],
    _playNumber: i + 1,
  }));
  state.currentIndex = 0;
  state.activeSlot = null;
  state.scoreExperts = 0;
  state.scoreViewers = 0;
  state.results = [];
  state.remainingNumbers = state.questions.map((_,i)=>i+1);
  state.timeDebt = 0;
  state.currentBonus = null;
  state.early = false;
  state.earlySeconds = null;
  state.undoSnapshot = null;
  state.phase = 'round';
  state.roundPhase = 'intro';
  state.justResetPool = poolReset;
  safeSave();
}

function newGamePreservingHistory(){
  drawGame();
}

/* =========================================================================
   6. ВОЛЧОК
   ========================================================================= */
const SECTOR_COUNT = 13;
function sectorAngle(n){ // n: 1..12 обычный номер, 13 = бонус
  const idx = (n === 13) ? 12 : (n - 1);
  return idx * (360 / SECTOR_COUNT);
}
function spinTo(targetNumber){
  const targetAngle = sectorAngle(targetNumber);
  const current = state.wheelRotation % 360;
  let delta = targetAngle - current;
  delta = ((delta % 360) + 360) % 360;
  const extraSpins = 4 + Math.floor(Math.random()*3); // 4-6 полных оборотов
  const newRotation = state.wheelRotation + extraSpins*360 + delta;
  state.wheelRotation = newRotation;
  const arrow = document.getElementById('wheel-arrow');
  if(arrow){ arrow.style.transform = `rotate(${newRotation}deg)`; }
}

function chooseLanding(){
  const options = state.remainingNumbers.slice();
  options.push(13);
  return options[Math.floor(Math.random()*options.length)];
}

let spinLock = false;
function onSpinClick(){
  if(spinLock) return;
  spinLock = true;
  ensureAudio();
  const landing = chooseLanding();
  spinTo(landing);
  const arrow = document.getElementById('wheel-arrow');
  const onEnd = () => {
    arrow.removeEventListener('transitionend', onEnd);
    spinLock = false;
    if(landing === 13){
      handleBonusLanding();
    }else{
      state.remainingNumbers = state.remainingNumbers.filter(n => n !== landing);
      state.activeSlot = landing;
      state.roundPhase = 'flavor';
      safeSave();
      render();
    }
  };
  if(arrow) arrow.addEventListener('transitionend', onEnd, {once:true});
  const btn = document.getElementById('btn-spin');
  if(btn) btn.setAttribute('disabled','disabled');
}

function handleBonusLanding(){
  let pool = BONUS_QUESTIONS.map((q,i)=>i).filter(i => state.playedBonusIndexes.indexOf(i) === -1);
  if(pool.length === 0){
    state.playedBonusIndexes = [];
    pool = BONUS_QUESTIONS.map((q,i)=>i);
  }
  const idx = pool[Math.floor(Math.random()*pool.length)];
  state.playedBonusIndexes.push(idx);
  state.currentBonus = BONUS_QUESTIONS[idx];
  state.roundPhase = 'bonus';
  safeSave();
  render();
}

function afterBonus(){
  state.currentBonus = null;
  state.roundPhase = 'intro';
  safeSave();
  render();
}

/* =========================================================================
   7. ТАЙМЕР
   ========================================================================= */
const timerState = { endsAt:null, remainingMs:null, running:false, rafId:null, durationMs:60000 };

function currentQuestionDurationSec(){
  const base = state.timerDuration;
  if(state.timeDebt > 0){
    return Math.max(20, base - state.timeDebt);
  }
  return base;
}

function startTimer(){
  const durSec = currentQuestionDurationSec();
  timerState.durationMs = durSec*1000;
  timerState.remainingMs = timerState.durationMs;
  timerState.endsAt = performance.now() + timerState.remainingMs;
  timerState.running = true;
  playStartTone();
  state.roundPhase = 'timerRunning';
  render();
  tickLoop();
}
function pauseTimer(){
  if(!timerState.running) return;
  timerState.remainingMs = Math.max(0, timerState.endsAt - performance.now());
  timerState.running = false;
  if(timerState.rafId) cancelAnimationFrame(timerState.rafId);
  state.roundPhase = 'timerPaused';
  render();
}
function resumeTimer(){
  timerState.endsAt = performance.now() + timerState.remainingMs;
  timerState.running = true;
  state.roundPhase = 'timerRunning';
  render();
  tickLoop();
}
function extendTimerCredit(){
  if(!timerState.running && !timerState.endsAt) return;
  const hasFuture = state.remainingNumbers.length > 0;
  if(!hasFuture) return;
  timerState.endsAt += 60000;
  timerState.durationMs += 60000;
  if(!timerState.running){ timerState.remainingMs += 60000; }
  state.timeDebt += 30;
  safeSave();
  render();
  // цикл tickLoop уже запущен (если таймер идёт) и сам подхватит новые значения
  // на следующем кадре — повторный запуск создал бы дублирующийся rAF-цикл.
}
let tickedLastSeconds = null;
function tickLoop(){
  if(!timerState.running) return;
  const remaining = timerState.endsAt - performance.now();
  if(remaining <= 0){
    updateTimerDOM(false, 0);
    timerState.running = false;
    tickedLastSeconds = null;
    playEndGong();
    state.roundPhase = 'answer-ready'; // истекло, но ответ ещё не открыт
    renderTimerDoneState();
    return;
  }
  const secsLeft = Math.ceil(remaining/1000);
  if(secsLeft <= 5 && secsLeft !== tickedLastSeconds){
    tickedLastSeconds = secsLeft;
    playTick();
  }
  updateTimerDOM(true, remaining);
  timerState.rafId = requestAnimationFrame(tickLoop);
}
function updateTimerDOM(running, remainingMsOverride){
  const digits = document.getElementById('timer-digits');
  const ring = document.getElementById('timer-ring-fg');
  if(!digits || !ring) return;
  const remaining = remainingMsOverride != null ? remainingMsOverride : Math.max(0, timerState.endsAt - performance.now());
  const secs = Math.max(0, Math.ceil(remaining/1000));
  const mm = String(Math.floor(secs/60)).padStart(2,'0');
  const ss = String(secs%60).padStart(2,'0');
  digits.textContent = `${mm}:${ss}`;
  const frac = Math.max(0, Math.min(1, remaining / timerState.durationMs));
  const circumference = 2*Math.PI*54;
  ring.style.strokeDasharray = `${circumference}`;
  ring.style.strokeDashoffset = `${circumference*(1-frac)}`;
  ring.classList.remove('warn','danger');
  digits.classList.remove('danger');
  if(secs <= 10){ ring.classList.add('danger'); digits.classList.add('danger'); }
  else if(secs <= 20){ ring.classList.add('warn'); }
}
function stopEarly(){
  if(timerState.rafId) cancelAnimationFrame(timerState.rafId);
  timerState.running = false;
  const remaining = Math.max(0, (timerState.endsAt||performance.now()) - performance.now());
  const elapsedSec = Math.round((timerState.durationMs - remaining)/1000);
  state.early = true;
  state.earlySeconds = elapsedSec;
  state.roundPhase = 'answer-ready';
  safeSave();
  render();
}
function revealAnswer(){
  if(timerState.rafId) cancelAnimationFrame(timerState.rafId);
  timerState.running = false;
  if(state.timeDebt > 0) state.timeDebt = 0;
  state.roundPhase = 'answer';
  safeSave();
  render();
}
function renderTimerDoneState(){
  state.roundPhase = 'answer-ready';
  render();
}

/* =========================================================================
   8. СЧЁТ / ПЕРЕХОДЫ
   ========================================================================= */
function scoreRound(correct){
  state.undoSnapshot = {
    scoreExperts: state.scoreExperts,
    scoreViewers: state.scoreViewers,
    results: state.results.slice(),
  };
  if(correct) state.scoreExperts++; else state.scoreViewers++;
  const q = state.questions[state.activeSlot - 1];
  state.results.push({
    questionId: q.id,
    question: q.question,
    correct: correct,
    early: state.early,
    earlySeconds: state.earlySeconds,
  });
  state.early = false;
  state.earlySeconds = null;
  state.roundPhase = 'scored';
  safeSave();
  render();
}
function undoScore(){
  if(!state.undoSnapshot) return;
  state.scoreExperts = state.undoSnapshot.scoreExperts;
  state.scoreViewers = state.undoSnapshot.scoreViewers;
  state.results = state.undoSnapshot.results;
  state.undoSnapshot = null;
  state.roundPhase = 'answer';
  safeSave();
  render();
}
function isGameOver(){
  return state.scoreExperts >= 6 || state.scoreViewers >= 6 || state.currentIndex >= state.questions.length - 1;
}
function nextRound(){
  state.undoSnapshot = null;
  if(isGameOver()){
    // отметить все сыгранные вопросы как played для будущих игр
    state.questions.forEach(q => {
      if(state.playedQuestionIds.indexOf(q.id) === -1) state.playedQuestionIds.push(q.id);
    });
    state.phase = 'summary';
    safeSave();
    render();
    return;
  }
  state.currentIndex++;
  state.activeSlot = null;
  state.roundPhase = 'intro';
  safeSave();
  render();
}
function backToSetup(){
  state = freshState();
  // сохраняем историю сыгранных вопросов между переходами на экран настройки не нужно - drawGame сам управляет
  const saved = (()=>{ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); }catch(e){ return null; } })();
  if(saved){
    state.playedQuestionIds = saved.playedQuestionIds || [];
    state.playedBonusIndexes = saved.playedBonusIndexes || [];
    state.wheelRotation = saved.wheelRotation || 0;
  }
  safeSave();
  render();
}

/* =========================================================================
   9. РЕНДЕР
   ========================================================================= */
function owlSVG(){
  return document.getElementById('tpl-owl').innerHTML;
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.phase === 'setup') html = renderSetup();
  else if(state.phase === 'round') html = renderRound();
  else html = renderSummary();
  app.innerHTML = html;
  attachEvents();
  if(state.phase === 'round' && (state.roundPhase === 'timerRunning' || state.roundPhase === 'timerPaused')){
    // восстановление визуального состояния таймера при перерисовке во время хода
    const remaining = state.roundPhase === 'timerPaused' ? timerState.remainingMs : undefined;
    updateTimerDOM(true, remaining);
  }
}

function renderSetup(){
  const total = QUESTIONS.length;
  const remaining = total - state.playedQuestionIds.length;
  return `
  <div class="wrap">
    <header class="top">${owlSVG()}<h1>Что? Где? Когда?</h1></header>
    <div class="card">
      <h2 class="section-title">Настройка игры</h2>
      <label class="field-label" for="in-team">Название команды (необязательно)</label>
      <input type="text" id="in-team" placeholder="Знатоки" value="${esc(state.teamName)}">
      <label class="field-label" for="in-timer">Время на обсуждение, секунд</label>
      <input type="number" id="in-timer" min="15" max="180" step="5" value="${state.timerDuration}">
      <div class="setup-stack">
        <button class="btn btn-gold btn-block" id="btn-draw" style="margin-top:20px;">🎲 Собрать игру — 12 вопросов</button>
      </div>
      <div class="pool-stat">В базе ${total} вопросов · сыграно ${state.playedQuestionIds.length} · осталось ${Math.max(0,remaining)}${remaining < 12 ? ' — начнётся новый круг' : ''}</div>
    </div>
    <p class="muted center" style="margin-top:16px;">Классика: «Знатоки» против «Телезрителей», игра до 6 очков или 12 вопросов.<br>На волчке 13 секторов — 13-й дарит бонусный вопрос без риска для счёта.</p>
  </div>`;
}

function renderScoreboard(){
  return `
  <div class="round-counter">Вопрос ${state.currentIndex+1} из ${state.questions.length}${state.teamName ? ' · ' + esc(state.teamName) : ''}</div>
  <div class="scoreboard">
    <div class="score-side experts"><div class="label">Знатоки</div><div class="num">${state.scoreExperts}</div></div>
    <div class="score-mid">:</div>
    <div class="score-side viewers"><div class="label">Телезрители</div><div class="num">${state.scoreViewers}</div></div>
  </div>`;
}

function renderWheel(){
  let nums = '';
  for(let i=1;i<=12;i++){
    nums += `<div class="wheel-num" style="--i:${i-1}">${i}</div>`;
  }
  nums += `<div class="wheel-num b13" style="--i:12">13</div>`;
  return `
  <div class="wheel-zone">
    <div class="wheel-outer">
      <div class="wheel-face"></div>
      ${nums}
      <div class="wheel-arrow" id="wheel-arrow" style="transform:rotate(${state.wheelRotation}deg)"></div>
      <div class="wheel-hub"></div>
    </div>
    <button class="btn btn-gold" id="btn-spin">🎡 Крутить волчок</button>
  </div>`;
}

function renderRound(){
  const q = state.questions[state.activeSlot - 1];
  const rp = state.roundPhase;
  let body = '';

  if(rp === 'intro'){
    body = renderWheel();
  } else if(rp === 'bonus'){
    const b = state.currentBonus;
    body = `
    <div class="card flavor-card">
      <div class="from" style="color:#ffd76a;">✨ СЕКТОР №13 — бонусный вопрос</div>
    </div>
    <div class="card" style="margin-top:12px;">
      <div class="question-text">${nl2br(b.question)}</div>
    </div>
    <div class="action-bar">
      <button class="btn btn-gold btn-block" id="btn-bonus-answer">Показать ответ</button>
    </div>`;
  } else if(rp === 'bonus-answer'){
    const b = state.currentBonus;
    body = `
    <div class="card flavor-card">
      <div class="from" style="color:#ffd76a;">✨ СЕКТОР №13</div>
    </div>
    <div class="card answer-block" style="margin-top:12px;">
      <div class="answer-label">Ответ</div>
      <div class="answer-text">${esc(b.answer)}</div>
      ${b.comment ? `<div class="comment-text">${nl2br(b.comment)}</div>` : ''}
    </div>
    <div class="action-bar">
      <button class="btn btn-gold btn-block" id="btn-bonus-continue">Крутить волчок дальше →</button>
    </div>`;
  } else if(rp === 'flavor'){
    body = `
    <div class="card flavor-card">
      <div class="from">Вопрос ${q._sender.verb} ${q._sender.name}</div>
      <div class="city">из города ${q._city}</div>
    </div>
    <div class="action-bar">
      <button class="btn btn-gold btn-block" id="btn-read-question">📖 Читать вопрос</button>
    </div>`;
  } else if(rp === 'question'){
    body = `
    <div class="card">
      <div class="question-text">${nl2br(q.question)}</div>
      <div class="qmeta">Выпал номер ${q._playNumber} на волчке${state.timeDebt>0 ? ` · время сокращено на ${state.timeDebt} сек (минута в кредит)` : ''}</div>
    </div>
    <div class="action-bar">
      <button class="btn btn-gold btn-block" id="btn-start-timer">⏱ Начать отсчёт — ${currentQuestionDurationSec()} сек</button>
    </div>`;
  } else if(rp === 'timerRunning' || rp === 'timerPaused'){
    const paused = rp === 'timerPaused';
    body = `
    <div class="card">
      <div class="question-text" style="font-size:clamp(15px,4vw,17px); opacity:.85;">${nl2br(q.question)}</div>
    </div>
    <div class="timer-zone">
      <div class="timer-ring-wrap">
        <svg viewBox="0 0 120 120">
          <circle class="timer-ring-bg" cx="60" cy="60" r="54"/>
          <circle class="timer-ring-fg" id="timer-ring-fg" cx="60" cy="60" r="54"/>
        </svg>
        <div class="timer-digits" id="timer-digits">--:--</div>
      </div>
      ${state.timeDebt>0 ? `<div class="debt-note">−${state.timeDebt} сек за «минуту в кредит»</div>` : ''}
    </div>
    <div class="action-bar">
      <div class="secondary-row">
        <button class="btn btn-outline" id="btn-pause-resume">${paused ? '▶ Продолжить' : '⏸ Пауза'}</button>
        <button class="btn btn-outline" id="btn-credit-minute" ${state.remainingNumbers.length===0 ? 'disabled' : ''}>+1 мин в кредит</button>
      </div>
      <button class="btn btn-gold btn-block" id="btn-early-answer">🔔 Досрочный ответ</button>
    </div>`;
  } else if(rp === 'answer-ready'){
    body = `
    <div class="card">
      <div class="question-text" style="font-size:clamp(15px,4vw,17px); opacity:.85;">${nl2br(q.question)}</div>
    </div>
    <div class="card center" style="margin-top:12px;">
      <div class="muted">${state.early ? `Ответ дан досрочно — за ${state.earlySeconds} сек` : 'Время вышло!'}</div>
    </div>
    <div class="action-bar">
      <button class="btn btn-gold btn-block" id="btn-reveal-answer">Показать ответ</button>
    </div>`;
  } else if(rp === 'answer'){
    const attrBits = [];
    if(q.author) attrBits.push('Автор: ' + esc(q.author));
    if(q.tournament) attrBits.push('Из турнира «' + esc(q.tournament) + '»');
    if(q.source) attrBits.push('Источник: ' + esc(q.source));
    body = `
    <div class="card answer-block">
      <div class="answer-label">Ответ</div>
      <div class="answer-text">${esc(q.answer)}</div>
      ${q.acceptable ? `<div class="accept-text">Засчитывать также: ${esc(q.acceptable)}</div>` : ''}
      ${q.comment ? `<div class="comment-text">${nl2br(q.comment)}</div>` : ''}
      ${attrBits.length ? `<div class="attribution">${attrBits.join('<br>')}</div>` : ''}
    </div>
    <div class="score-buttons">
      <button class="btn btn-experts" id="btn-score-experts">✅<br><small>Знатоки</small></button>
      <button class="btn btn-viewers" id="btn-score-viewers">❌<br><small>Телезрители</small></button>
    </div>`;
  } else if(rp === 'scored'){
    const last = state.results[state.results.length-1];
    body = `
    <div class="card center">
      <div class="muted" style="margin-bottom:8px;">Засчитано: ${last.correct ? '✅ Знатокам' : '❌ Телезрителям'}</div>
      <div class="final-score" style="padding:2px 0;">
        <div class="big">${state.scoreExperts} : ${state.scoreViewers}</div>
      </div>
    </div>
    <div class="undo-bar">
      <button class="btn btn-ghost btn-sm" id="btn-undo">↩ Отменить</button>
    </div>
    <div class="action-bar">
      <button class="btn btn-gold btn-block" id="btn-next-round">${isGameOver() ? 'Показать итоги →' : 'Следующий вопрос →'}</button>
    </div>`;
  }

  return `
  <div class="wrap">
    <header class="top">${owlSVG()}<h1>Что? Где? Когда?</h1></header>
    ${renderScoreboard()}
    ${body}
  </div>`;
}

function renderSummary(){
  const winner = state.scoreExperts > state.scoreViewers ? 'Знатоки' : (state.scoreViewers > state.scoreExperts ? 'Телезрители' : 'Ничья');
  const rows = state.results.map((r,i) => `
    <div class="result-row">
      <span class="dot ${r.correct?'ok':'no'}"></span>
      <span class="qn">${i+1}.</span>
      <span class="qt">${esc(r.question).slice(0,80)}${r.question.length>80?'…':''}</span>
    </div>`).join('');
  return `
  <div class="wrap">
    <header class="top">${owlSVG()}<h1>Что? Где? Когда?</h1></header>
    <div class="card final-score">
      <div class="muted" style="margin-bottom:6px;">Игра окончена</div>
      <div class="big">${state.scoreExperts} : ${state.scoreViewers}</div>
      <div class="who">Победили: ${winner}</div>
    </div>
    <div class="card" style="margin-top:14px;">
      <h2 class="section-title">Все вопросы игры</h2>
      <div class="result-list">${rows}</div>
    </div>
    <div class="action-bar">
      <button class="btn btn-gold btn-block" id="btn-new-game">🎲 Новая игра</button>
      <button class="btn btn-outline btn-block" id="btn-to-setup">Настройки</button>
    </div>
  </div>`;
}

/* =========================================================================
   10. СОБЫТИЯ
   ========================================================================= */
function once(id, fn){
  const el = document.getElementById(id);
  if(el) el.addEventListener('click', function handler(e){
    el.removeEventListener('click', handler);
    fn(e);
  });
}
function attachEvents(){
  once('btn-draw', () => {
    const teamEl = document.getElementById('in-team');
    const timerEl = document.getElementById('in-timer');
    state.teamName = teamEl ? teamEl.value.trim() : '';
    const t = timerEl ? parseInt(timerEl.value,10) : 60;
    state.timerDuration = (t && t>=10 && t<=300) ? t : 60;
    drawGame();
    render();
  });
  once('btn-spin', onSpinClick);
  once('btn-bonus-answer', () => { state.roundPhase = 'bonus-answer'; render(); });
  once('btn-bonus-continue', afterBonus);
  once('btn-read-question', () => { state.roundPhase = 'question'; safeSave(); render(); });
  once('btn-start-timer', startTimer);
  once('btn-pause-resume', () => { timerState.running ? pauseTimer() : resumeTimer(); });
  once('btn-credit-minute', extendTimerCredit);
  once('btn-early-answer', stopEarly);
  once('btn-reveal-answer', revealAnswer);
  once('btn-score-experts', () => scoreRound(true));
  once('btn-score-viewers', () => scoreRound(false));
  once('btn-undo', undoScore);
  once('btn-next-round', nextRound);
  once('btn-new-game', () => { drawGame(); render(); });
  once('btn-to-setup', backToSetup);
}

/* =========================================================================
   11. ИНИЦИАЛИЗАЦИЯ
   ========================================================================= */
safeLoad();
if(state.phase !== 'setup'){
  // при обновлении страницы посреди игры - безопаснее вернуться к настройке,
  // но сохраняем накопленную историю сыгранных вопросов и счётчик волчка
  const played = state.playedQuestionIds;
  const playedBonus = state.playedBonusIndexes;
  const wheel = state.wheelRotation;
  state = freshState();
  state.playedQuestionIds = played;
  state.playedBonusIndexes = playedBonus;
  state.wheelRotation = wheel;
}
render();
</script>
</body>
</html>
